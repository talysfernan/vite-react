<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Constelação de ações</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090b'/%3E%3Cpath d='M4 18h24' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M10 18 16 8l6 10' stroke='%23fff' stroke-width='1.6' fill='none'/%3E%3Ccircle cx='10' cy='18' r='3' fill='%2309090b' stroke='%23fff' stroke-width='1.6'/%3E%3Ccircle cx='22' cy='18' r='3' fill='%23ff4fa0'/%3E%3Ccircle cx='16' cy='8' r='2.6' fill='%23a5a6ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;--bg2:#0e0e11;--pn:#141418;--pn2:#1b1b21;--pn3:#23232b;--ln:#2a2a33;--ln2:#3a3a45;
  --tx:#f5f5f7;--mu:#8e8e9a;--mu2:#5d5d68;--acc:#a5a6ff;--acc2:#ff4fa0;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;
  --r:14px;--sh:0 18px 60px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --ease:cubic-bezier(.2,.9,.25,1.15);--ease2:cubic-bezier(.22,1,.36,1);
  --safeB:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
body.locked #app{filter:blur(8px);pointer-events:none}
#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:var(--bg);transition:opacity .5s}
#boot.out{opacity:0;pointer-events:none}
.bootc{display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--mu);font-size:13px}
.bootl{width:180px;height:2px;background:var(--ln);position:relative;overflow:hidden;border-radius:2px}
.bootl::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:bootl 1.1s infinite}
@keyframes bootl{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* ---------- palco infinito ---------- */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);
  background-image:radial-gradient(circle,rgba(255,255,255,.075) 1px,transparent 1.3px);background-size:26px 26px}
#stage.panning{cursor:grabbing}
body.placing #stage{cursor:crosshair}
#stars{position:absolute;inset:-10%;pointer-events:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.0;animation:tw 6s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.55;transform:scale(1)}}
body.nostars #stars{display:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.fly{transition:transform .65s var(--ease2)}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires .e{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;transition:opacity .25s,stroke .2s}
#wires .e.dash{stroke-dasharray:7 7}
#wires .e.bridge{stroke-dasharray:3 7;stroke:#a5a6ff;opacity:.85}
#wires .e.sel{stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px rgba(165,166,255,.7))}
#wires .e.new{animation:draw .7s var(--ease2) both}
@keyframes draw{from{stroke-dasharray:var(--L) var(--L);stroke-dashoffset:var(--L)}to{stroke-dasharray:var(--L) var(--L);stroke-dashoffset:0}}
#wires .hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
#wires .elab{font-size:11px;font-weight:600;fill:#d6d6de;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
#wires .tmp{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:6 6;animation:march .6s linear infinite}
@keyframes march{to{stroke-dashoffset:-12}}
.sp-base{stroke:#34343d;stroke-width:2}
.sp-done{stroke:#fff;stroke-width:2.2;transition:all .6s var(--ease2)}
.sp-comet{stroke:url(#cometG);stroke-width:4;stroke-linecap:round;fill:none;stroke-dasharray:70 1000;animation:comet 5.5s linear infinite;opacity:.9}
@keyframes comet{from{stroke-dashoffset:1070}to{stroke-dashoffset:0}}
body.noanim .sp-comet{display:none}
.sp-glow{stroke:var(--acc);stroke-width:10;opacity:0;transition:opacity .2s;filter:blur(6px)}
.sp-glow.on{opacity:.5}
.sp-tick{stroke:#2c2c35;stroke-width:1.5}
.sp-cap{fill:#5d5d68;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}

/* título do mês dentro do mundo */
#mtitle{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto}
#mtitle .chip{min-width:280px;text-align:center;padding:10px 28px;border-radius:12px;background:#151519;border:1px solid #2b2b33;font-weight:600;font-size:20px;letter-spacing:.01em;cursor:pointer;transition:transform .25s var(--ease),border-color .2s}
#mtitle .chip:hover{transform:translateY(-2px);border-color:#4a4a55}
#mtitle .sub{font-size:12px;color:var(--mu);display:flex;gap:12px;align-items:center;white-space:nowrap}
#mtitle .bar{width:120px;height:4px;border-radius:4px;background:#26262e;overflow:hidden}
#mtitle .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px;transition:width .6s var(--ease2)}

/* ---------- estrelas (nós) ---------- */
.nd{position:absolute;left:0;top:0;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .3s}
.nd>.nin{position:relative;transform-origin:50% 50%}
.nd.enter>.nin{animation:pop .55s var(--ease) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.nd.leave>.nin{animation:leave .3s ease-in both}
@keyframes leave{to{transform:scale(.2);opacity:0}}
.nd.drag{z-index:5;cursor:grabbing}
.nd.drag>.nin{transform:scale(1.06);filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
.nd.dim{opacity:.13}
.nd.hl>.nin{animation:hl 1.2s var(--ease2) 2}
@keyframes hl{0%,100%{filter:none}50%{filter:drop-shadow(0 0 18px var(--acc)) drop-shadow(0 0 4px #fff)}}
.nd.sel>.nin::before{content:"";position:absolute;inset:-7px;border-radius:999px;border:1.5px solid var(--acc);box-shadow:0 0 0 4px rgba(165,166,255,.14),0 0 22px rgba(165,166,255,.35);pointer-events:none;animation:selp 2.4s ease-in-out infinite}
.nd.sq.sel>.nin::before{border-radius:10px}
@keyframes selp{50%{box-shadow:0 0 0 7px rgba(165,166,255,.08),0 0 30px rgba(165,166,255,.45)}}
.shp{display:flex;align-items:center;justify-content:center;white-space:nowrap;position:relative}
/* pílula/plano */
.k-plano .shp{height:34px;padding:0 26px;border-radius:999px;border:2.5px solid #fff;color:#0b0b0e;font-weight:600;font-size:14.5px;background:var(--c,#a5a6ff)}
/* ação */
.k-acao .shp{height:21px;padding:0 15px;border-radius:999px;background:var(--c,#fff);color:#0b0b0e;font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
/* reunião */
.k-reuniao .shp{height:34px;padding:0 30px;border-radius:999px;border:2.2px solid var(--c,#fff);color:#fff;background:var(--bg);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase}
/* marco */
.k-marco .shp{width:28px;height:28px;border-radius:50%;border:2.4px solid #fff;background:var(--bg)}
.k-marco .shp::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,#fff)}
.k-marco.done .shp::after{background:var(--ok)}
/* trilho esticável */
.k-etapa .shp{height:32px;border-radius:999px;border:2px solid var(--c,#a5a6ff);background:color-mix(in srgb,var(--c,#a5a6ff) 14%,var(--bg));justify-content:flex-start;padding:0 16px;overflow:hidden;font-weight:600;font-size:13.5px}
.k-etapa .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--c,#a5a6ff) 45%,transparent);border-radius:999px 0 0 999px;transition:width .6s var(--ease2)}
.k-etapa .shp span{position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis}
.k-etapa .pct{margin-left:auto;padding-left:12px;font-size:11px;opacity:.75;position:relative;z-index:1}
/* período */
.k-periodo .shp{height:9px;background:repeating-linear-gradient(-45deg,var(--c,#ffc700) 0 4px,#111 4px 8px);border-radius:1px}
.k-periodo .brk{position:absolute;left:0;right:0;bottom:16px;height:18px;border:2px solid #fff;border-bottom:0;pointer-events:none}
.k-periodo .plab{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
/* ícones redondos */
.k-canal .shp,.k-campanha .shp,.k-conteudo .shp,.k-meta .shp,.k-ideia .shp{width:44px;height:44px;border-radius:50%;border:2.4px solid #fff;background:var(--c,#ff2f7e)}
.k-canal .shp svg,.k-campanha .shp svg,.k-conteudo .shp svg,.k-meta .shp svg,.k-ideia .shp svg{width:22px;height:22px}
.k-canal .shp img{width:26px;height:26px;object-fit:contain}
.k-campanha .shp{background:var(--c,#ff8a3d)}.k-conteudo .shp{background:var(--c,#00c2ff)}.k-meta .shp{background:var(--c,#34d399)}.k-ideia .shp{background:var(--c,#fbbf24)}
.k-loja .shp{gap:7px;font-weight:700;font-size:21px;letter-spacing:-.02em;color:#fff;padding:2px 4px}
.k-loja .shp .lg{width:26px;height:26px;display:grid;place-items:center}
.k-loja .shp .lg svg{width:24px;height:24px}
.k-loja .shp img.wide{height:30px;max-width:150px;object-fit:contain}
.k-marca .shp{gap:8px;padding:5px 14px 5px 5px;border-radius:12px;background:#17171c;border:1.5px solid var(--c,#fff);font-weight:600;font-size:13.5px}
.k-marca .shp .bl{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--c,#fff);color:#0b0b0e;font-weight:700;font-size:12px;overflow:hidden}
.k-marca .shp .bl img{width:100%;height:100%;object-fit:cover}
.k-time .shp{gap:2px;padding:4px 2px;color:var(--c,#fff)}
.k-time .shp svg{width:17px;height:17px;fill:currentColor;stroke:none}
.k-pessoa .shp{width:38px;height:38px;border-radius:50%;background:var(--c,#a5a6ff);color:#0b0b0e;font-weight:700;font-size:13px;border:2.4px solid #fff;overflow:hidden}
.k-pessoa .shp img{width:100%;height:100%;object-fit:cover}
.k-quadro .shp{width:28px;height:28px;border:2px solid #fff;border-radius:3px;background:var(--bg)}
.k-quadro .shp svg{width:16px;height:16px}
.k-lista .shp{flex-direction:column;gap:4px;padding:2px}
.k-lista .shp i{display:block;width:44px;height:7px;border-radius:9px;border:2px solid #fff}
.k-lista .shp i:first-child{background:var(--c,#34d399);border-color:var(--c,#34d399)}
.k-nota .shp{width:190px;min-height:70px;white-space:normal;align-items:flex-start;justify-content:flex-start;padding:12px 14px;background:color-mix(in srgb,var(--c,#fde68a) 92%,#000);color:#1b1b1b;border-radius:4px 14px 14px 14px;font-size:12.5px;font-weight:500;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:rotate(-1.2deg)}
.sq{}
/* rótulo abaixo dos ícones */
.lab{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);font-size:11.5px;font-weight:600;color:#e7e7ec;white-space:nowrap;pointer-events:none;text-shadow:0 1px 6px #000,0 0 2px #000;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.lab.top{top:auto;bottom:calc(100% + 7px)}
/* selo de status */
.st{position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);background:var(--s)}
.st.ok{width:16px;height:16px;right:-6px;top:-7px;display:grid;place-items:center;background:var(--ok)}
.st.ok svg{width:9px;height:9px;stroke:#062;stroke-width:3.5}
.st.pulse{animation:stp 1.6s infinite}
@keyframes stp{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--s) 25%,transparent)}}
/* metadados (pessoas, marcas, prazo) */
.meta{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);display:flex;gap:4px;align-items:center;pointer-events:none;white-space:nowrap}
.has-lab .meta{top:calc(100% + 26px)}
.av{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#0b0b0e;border:1.5px solid var(--bg);margin-left:-6px;overflow:hidden}
.av:first-child{margin-left:0}
.av img{width:100%;height:100%;object-fit:cover}
.bd{width:8px;height:8px;border-radius:2px}
.due{font-size:10px;color:var(--mu);padding:1px 6px;border-radius:6px;background:#17171c;border:1px solid #26262e}
.due.late{color:#fca5a5;border-color:#5b2626}
body.far .meta,body.far .lab{opacity:0}
body.nodetail .meta{display:none}
/* puxadores */
.knob{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#0b0b0e;display:none;place-items:center;right:-34px;top:50%;margin-top:-11px;box-shadow:0 0 0 4px rgba(165,166,255,.18);cursor:crosshair;animation:knob .35s var(--ease) both}
.knob svg{width:13px;height:13px;stroke-width:2.6}
.knob::before{content:"";position:absolute;inset:-12px}
@keyframes knob{from{transform:scale(0)}}
.nd.sel .knob{display:grid}
body.ro .knob,body.ro .grip{display:none!important}
.grip{position:absolute;top:50%;width:14px;height:26px;margin-top:-13px;border-radius:6px;background:#fff;display:none;cursor:ew-resize;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.grip::before{content:"";position:absolute;inset:-10px}
.grip::after{content:"";position:absolute;left:5px;top:7px;width:4px;height:12px;border-left:1.5px solid #888;border-right:1.5px solid #888}
.grip.l{left:-7px}.grip.r{right:-7px}
.nd.sel .grip{display:block}
.k-periodo .grip{height:22px;margin-top:-11px}
/* pontes (fantasmas de outros meses) */
.ghost{position:absolute;transform:translate(-50%,-50%);padding:6px 12px 6px 10px;border-radius:999px;border:1.5px dashed #6d6ea8;background:rgba(20,20,30,.85);color:#c9caff;font-size:11.5px;font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center;cursor:pointer;transition:transform .25s var(--ease),background .2s;max-width:260px}
.ghost:hover{transform:translate(-50%,-50%) scale(1.05);background:#1d1d2e}
.ghost b{font-weight:700;color:#8e90ff;text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.ghost span{overflow:hidden;text-overflow:ellipsis}

/* ---------- barra superior ---------- */
#top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;z-index:20;pointer-events:none}
#top>*{pointer-events:auto}
.glass{background:rgba(20,20,24,.82);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid #2a2a32;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 8px;height:46px}
.brand .logo{width:30px;height:30px}
.brand .nm{font-weight:700;font-size:14px;line-height:1.05;letter-spacing:-.01em}
.brand .nm small{display:block;font-weight:500;font-size:11px;color:var(--mu);letter-spacing:0}
.flag{font-size:18px;line-height:1;padding:6px 8px;border-radius:9px;background:#1e1e25;border:1px solid #2e2e37;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600}
.flag span{font-size:17px}
.mnav{display:flex;align-items:center;gap:2px;padding:4px;height:46px;margin:0 auto}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#d4d4dc;transition:background .15s,color .15s,transform .15s}
.ib:hover{background:#25252d;color:#fff}
.ib:active{transform:scale(.92)}
.ib.on{background:#2b2b38;color:var(--acc)}
.mbtn{padding:0 16px;height:38px;border-radius:10px;font-weight:600;font-size:15px;min-width:150px;text-transform:capitalize;transition:background .15s}
.mbtn:hover{background:#25252d}
.mbtn small{font-weight:500;color:var(--mu);font-size:12px;margin-left:4px}
.tools{display:flex;align-items:center;gap:2px;padding:4px;height:46px}
.sv{width:8px;height:8px;border-radius:50%;background:var(--ok);margin:0 8px 0 6px;transition:background .3s}
.sv.busy{background:var(--warn);animation:stp 1s infinite;--s:var(--warn)}
.sv.err{background:var(--bad)}
.who{font-size:12px;color:var(--mu);padding:0 8px 0 2px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--acc2);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.ib{position:relative}
#fchips{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:19;flex-wrap:wrap;justify-content:center;max-width:90vw}
.fchip{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;border-radius:999px;background:#1c1c24;border:1px solid #33333f;font-size:12px;font-weight:500;animation:pop .35s var(--ease) both}
.fchip button{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#33333f}
.fchip button svg{width:10px;height:10px}

/* ---------- dock ---------- */
#dock{position:fixed;left:50%;bottom:calc(14px + var(--safeB));transform:translateX(-50%);z-index:20;display:flex;align-items:stretch;gap:4px;padding:6px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#dock::-webkit-scrollbar{display:none}
body.ro #dock{display:none}
.dg{display:flex;flex-direction:column;gap:3px;padding:0 4px}
.dg+.dg{border-left:1px solid #2a2a32;padding-left:8px}
.dg>small{font-size:9.5px;color:var(--mu2);font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding-left:4px}
.dg>div{display:flex;gap:2px}
.di{width:58px;height:54px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#d9d9e0;font-size:9.5px;font-weight:500;transition:background .15s,transform .2s var(--ease);user-select:none;-webkit-user-select:none;flex:none}
.di:hover{background:#23232b;transform:translateY(-3px)}
.di.on{background:#2c2c3c;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.di .pv{height:22px;display:grid;place-items:center;pointer-events:none}
.mini{display:block}
.dragghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.92;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6));transition:none}

/* zoom e desfazer */
#zoom{position:fixed;right:12px;bottom:calc(14px + var(--safeB));z-index:20;display:flex;flex-direction:column;padding:4px;gap:2px}
#zoom .zl{font-size:10px;text-align:center;color:var(--mu);padding:2px 0}
#undo{position:fixed;left:12px;bottom:calc(14px + var(--safeB));z-index:20;display:flex;flex-direction:column;padding:4px;gap:2px}
body.ro #undo{display:none}
@media (max-width:760px){
  #dock{bottom:calc(10px + var(--safeB));left:10px;right:10px;transform:none;max-width:none}
  #zoom{bottom:calc(92px + var(--safeB));right:10px}
  #undo{bottom:calc(92px + var(--safeB));left:10px}
  .brand .nm small{display:none}
  .brand .nm{display:none}
  .mbtn{min-width:0;padding:0 8px;font-size:14px}
  .mbtn small{display:none}
  .who{display:none}
  #top{left:8px;right:8px;gap:6px}
  .tools .hide-s{display:none}

}
async function flush() {
  if (flushing || !pending.size) return;
  flushing = true;
  const ops = [...pending].map(([path, body]) => ({ path, body }));
  pending.clear();
  try {
    for (let i = 0; i < ops.length; i += 400) await req('/api/docs', { method: 'POST', body: JSON.stringify({ ops: ops.slice(i, i + 400) }) });
    saveErr = 0; setSv(pending.size ? 'busy' : '');
  } catch (e) {
    for (const o of ops) if (!pending.has(o.path)) pending.set(o.path, o.body);
    saveErr++; setSv('err');
    if (/leitura/.test(e.message)) { toast(e.message); pending.clear(); setSv(''); }

}

}

$('#byear').onclick = () => openYear(+S.month.slice(0, 4));
function openYear(yr) {
  const W = 300, H = 520, top = 70, mid = 300, pad = 30, svgW = 12 * W + pad * 2;
  const pos = {}, months = [];
  let body = '';
  for (let i = 0; i < 12; i++) {
    const m = `${yr}-${String(i + 1).padStart(2, '0')}`, ns = monthNodes(m), x0 = pad + i * W;
    const { min, max } = spineExt(ns), done = ns.filter(n => n.status === 'feito').length;
    let dots = '';
    for (const n of ns) {
      const x = x0 + 22 + (n.x - min) / (max - min) * (W - 44), y = mid + clamp(n.y * .16, -150, 150);
      pos[n.id] = { x, y };
      const col = n.k === 'marco' ? '#fff' : n.color || ({ acao: '#fff', reuniao: '#fff', canal: '#ff2f7e', loja: '#ff9900', periodo: '#ffc700' })[n.k] || '#a5a6ff';
      dots += `<circle class="ydot" cx="${x}" cy="${y}" r="${n.spine ? 4.5 : n.k === 'plano' ? 4 : 2.6}" fill="${col}" ${n.status === 'feito' ? 'stroke="#34d399" stroke-width="2"' : ''}/>`;
    }
    let lines = '';
    for (const e of allEdges()) { const a = pos[e.a], b = pos[e.b]; if (a && b && N(e.a).m === m && N(e.b).m === m) lines += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#ffffff" stroke-opacity=".28" stroke-width="1"/>`; }
    const isNow = m === nowM(), isCur = m === S.month;
    body += `<g class="ym" data-ym="${m}"><rect class="bgm" x="${x0 + 4}" y="${top}" width="${W - 8}" height="${H - top - 10}" rx="16"/>${isCur ? `<rect x="${x0 + 4}" y="${top}" width="${W - 8}" height="${H - top - 10}" rx="16" fill="none" stroke="#a5a6ff" stroke-opacity=".5" stroke-dasharray="4 6"/>` : ''}
      <line x1="${x0 + 14}" x2="${x0 + W - 14}" y1="${mid}" y2="${mid}" stroke="${isNow ? '#a5a6ff' : '#3a3a45'}" stroke-width="2"/>${lines}${dots}
      <text class="mn" x="${x0 + W / 2}" y="${top + 34}" text-anchor="middle">${MONTHS[i]}</text>
      <text class="ms" x="${x0 + W / 2}" y="${top + 54}" text-anchor="middle">${ns.length ? `${ns.length} estrelas · ${Math.round(done / ns.length * 100)}%` : 'vazio'}${isNow ? ' · agora' : ''}</text>
      <rect x="${x0 + 60}" y="${H - 44}" width="${W - 120}" height="4" rx="2" fill="#26262e"/><rect x="${x0 + 60}" y="${H - 44}" width="${ns.length ? (W - 120) * done / ns.length : 0}" height="4" rx="2" fill="#34d399"/></g>`;
    months.push(m);
  }
  let arcs = '', nb = 0;
  for (const e of allEdges()) {
    const A = N(e.a), Bn = N(e.b); if (!A || !Bn || A.m === Bn.m) continue;
    const a = pos[e.a], b = pos[e.b]; if (!a || !b) continue; nb++;
    const h = Math.min(260, 60 + Math.abs(b.x - a.x) * .18);
    arcs += `<path class="yarc" d="M${a.x} ${a.y}C${a.x} ${mid - h} ${b.x} ${mid - h} ${b.x} ${b.y}"><title>${esc(label(A))} → ${esc(label(Bn))}</title></path>`;
  }
  const y = $('#year');
  y.innerHTML = `<div class="yhd"><button class="ib" data-yy="-1">${ic('chevL')}</button><h3>Constelação de ${yr}<small>${nb} ponte${nb === 1 ? '' : 's'} entre meses · ${bcfg().flag} ${esc(bcfg().country)}</small></h3><button class="ib" data-yy="1">${ic('chevR')}</button><button class="ib" data-yclose title="Fechar">${ic('x')}</button></div>
    <div class="ysc"><svg width="${svgW}" height="${H}" viewBox="0 0 ${svgW} ${H}">${body}${arcs}</svg></div>
    <div class="ylegend"><span><i></i>pontes: ações que continuam ou se complementam entre meses</span><span>toque num mês para entrar nele</span></div>`;
  y.classList.add('on');
  const sc = y.querySelector('.ysc'), ci = months.indexOf(S.month);
  sc.scrollLeft = ci >= 0 ? Math.max(0, pad + ci * W - innerWidth / 2 + W / 2) : 0;
  y.onclick = e => {
    if (e.target.closest('[data-yclose]')) return y.classList.remove('on');
    const yy = e.target.closest('[data-yy]'); if (yy) return openYear(yr + +yy.dataset.yy);
    const g = e.target.closest('[data-ym]'); if (g) { y.classList.remove('on'); goMonth(g.dataset.ym); }
  };
}

function regEditor(k) {

function regSet(k, fn, redraw = true) { const items = clone(reg(k)); fn(items); saveReg(k, items); if (redraw) drawSettings(); }
let pickFile = null;
$('#file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f && pickFile) pickFile(f); };
function readImg(f, max = 160000) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(f.type)) return rej('Envie uma imagem (SVG, PNG, JPG ou WebP)');
    const r = new FileReader();
    r.onload = () => {
      if (f.type === 'image/svg+xml' || r.result.length <= max) { if (r.result.length > 400000) return rej('Arquivo grande demais (máx. ~300 KB)'); return res(r.result); }
      const img = new Image(); img.onload = () => { const s = Math.min(1, 256 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; img.onerror = () => rej('Imagem inválida'); img.src = r.result;
    };
    r.readAsDataURL(f);
  });
}
$('#modal').addEventListener('click', async e => {
  const t = e.target;
  const st = t.closest('[data-st]'); if (st) { SET.tab = st.dataset.st; drawSettings(); return; }

  }

  const mv = t.closest('[data-rmv]'); if (mv) { const [i, d] = mv.dataset.rmv.split(':').map(Number); regSet(k, a => { const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; }); return; }
  const clr = t.closest('[data-rclr]'); if (clr) { const [i, f] = clr.dataset.rclr.split(':'); regSet(k, a => delete a[+i][f]); return; }
  const ri = t.closest('[data-ri]'); if (ri) { const [i, f] = ri.dataset.ri.split(':'); pickFile = async file => { try { const url = await readImg(file, f === 'wide' ? 240000 : 160000); regSet(k, a => a[+i][f] = url); } catch (er) { toast(String(er)); } }; $('#file').accept = 'image/*'; $('#file').click(); return; }
  const rico = t.closest('[data-rico]'); if (rico) { iconPicker(k, +rico.dataset.rico); return; }
  const dx = t.closest('[data-dx]')?.dataset.dx;
  if (dx === 'export') doExport();
  if (dx === 'import') { pickFile = async f => { try { const d = JSON.parse(await f.text()); const docs = d.docs || {}; let n = 0; for (const [p, b] of Object.entries(docs)) { const q = p.replace(/^(node|edge)\/(br|us)\./, `$1/${B()}.`).replace(/^app\/board\.(br|us)$/, `app/board.${B()}`); if (/^(node|edge)\//.test(q) && b) b.b = B(); put(q, b); n++; } toast(`${n} itens importados`); render(); drawSettings(); } catch (er) { toast('Arquivo inválido'); } }; $('#file').accept = '.json,application/json'; $('#file').click(); }
  if (dx === 'backups') { const box = $('#modal [data-bk]'); box.innerHTML = '<div class="note">Carregando…</div>'; try { const d = await req('/api/backups'); box.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn sm pri" data-bknow>${ic('plus')} Fazer backup agora</button>${(d.backups || []).map(b => `<button class="btn sm" data-bkd="${b.day}">${ic('download')} ${b.day.split('-').reverse().join('/')}</button>`).join('') || '<span class="note">Nenhum backup ainda — o primeiro sai hoje à noite.</span>'}</div>`; } catch (er) { box.innerHTML = `<div class="note">${esc(er.message)}</div>`; } }
  if (t.closest('[data-bknow]')) { await req('/api/backups/now', { method: 'POST' }).catch(() => { }); toast('Backup feito'); $('#modal [data-dx="backups"]').click(); }
  const bkd = t.closest('[data-bkd]'); if (bkd) { const d = await req('/api/backups/' + bkd.dataset.bkd); download(`constelacao-${B()}-backup-${bkd.dataset.bkd}.json`, d); }
  if (t.closest('[data-pal-add]')) { const c = bcfg(); setBoard('palette', [...c.palette, '#ffffff']); drawSettings(); }
  if (t.closest('[data-pal-rm]')) { const c = bcfg(); if (c.palette.length > 1) setBoard('palette', c.palette.slice(0, -1)); drawSettings(); }
});
$('#modal').addEventListener('input', e => {
  if (ro()) return;
  const t = e.target;
  if (t.dataset.rf) { const [i, f] = t.dataset.rf.split(':'); regSet(SET.tab, a => a[+i][f] = t.value, false); clearTimeout(drawSettings.t); if (f !== 'name' && f !== 'cargo') drawSettings(); else drawSettings.t = setTimeout(() => { const pv = t.closest('.reg')?.querySelector('.pvw'); if (pv) { const kind = { people: 'pessoa', teams: 'time', brands: 'marca', channels: 'canal', stores: 'loja' }[SET.tab]; const sh = shape({ id: 'x', k: kind, ref: reg(SET.tab)[+i].id, title: '', status: 'planejado' }, { preview: 1 }); pv.innerHTML = `<div class="${sh.cls}">${sh.html}</div>`; } }, 120); return; }

});
function setBoard(k, v) { const p = 'app/board.' + B(); const cur = { ...(S.docs[p] || {}) }; cur[k] = v; put(p, cur); }

function iconPicker(k, i) {
  const it = reg(k)[i];
  const draw = q => {
    const keys = LIB_KEYS.filter(x => !q || norm(libName(x)).includes(norm(q)));
    return keys.map(x => `<button class="${it.icon === x ? 'on' : ''}" data-pick="${x}" title="${esc(libName(x))}" style="background:${libColor(x)}">${logoSvg(x, ink(libColor(x)))}</button>`).join('');
  };
  openModal(`<div class="mdl sm glass"><div class="mhd"><h3>Logo de “${esc(it.name)}”</h3><button class="ib" data-back>${ic('x')}</button></div><div style="padding:16px 18px;overflow:auto">

  const m = $('#modal');

  up.ondragover = e => { e.preventDefault(); up.classList.add('ov'); }; up.ondragleave = () => up.classList.remove('ov');

  m.querySelector('[data-svgok]').onclick = () => { const s = m.querySelector('[data-svg]').value.trim(); if (!/^<svg[\s\S]*<\/svg>$/i.test(s)) return toast('Cole um SVG completo (<svg …>…</svg>)'); const clean = s.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son\w+="[^"]*"/gi, '').replace(/javascript:/gi, ''); regSet(k, a => a[i].icon = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(clean))), false); done(); };

function doExport() {

function download(name, obj) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

/* ---------- teclado ---------- */
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select,[contenteditable]');
  if (e.key === 'Escape') { if (POP) return closePop(); if ($('#modal').classList.contains('on')) return closeModal(); if ($('#year').classList.contains('on')) return $('#year').classList.remove('on'); if (ED.id) return closeEditor(); if (PLACE) return cancelPlace(); S.sel = null; S.selEdge = null; render(); return; }
  if (typing) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (!ro()) undo(e.shiftKey); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); if (!ro()) undo(true); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); if (S.sel && !ro()) dup(S.sel); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !ro()) { if (S.sel) { delNode(S.sel); render(); toast('Estrela excluída', 'Desfazer', () => undo()); } else if (S.selEdge) { put(EP(S.selEdge), null); S.selEdge = null; closePop(); drawEdges(); } return; }
  if (e.key === 'Enter' && S.sel) { e.preventDefault(); openEditor(S.sel); return; }
  if (e.key === 'f' || e.key === 'F') return fit();
  if (e.key === '/') { e.preventDefault(); openSearch($('#bsearch')); return; }
  if (e.key === 'ArrowLeft' && !S.sel) return goMonth(mAdd(S.month, -1));
  if (e.key === 'ArrowRight' && !S.sel) return goMonth(mAdd(S.month, 1));
  if (e.key === '+' || e.key === '=') return zoomAt(innerWidth / 2, innerHeight / 2, 1.2, true);
  if (e.key === '-') return zoomAt(innerWidth / 2, innerHeight / 2, .83, true);
});
window.addEventListener('resize', () => { render(); });

/* =========================================================
   Login (Quintal do CAO(S)) e início
   ========================================================= */
const QUINTAL = 'https://meucaos.com/';
function lock() {
  document.body.classList.add('locked');
  const emerg = /[?&]emergencia\b/.test(location.search);
  if (emerg) return emergencyGate(false);
  fetch('/api/session', { credentials: 'same-origin' }).then(r => r.json()).catch(() => ({ down: true })).then(d => {
    if (d.role) { location.reload(); return; }
    if (d.down) return emergencyGate(true);
    if (d.reason === 'acesso') return denied(d);
    location.replace(QUINTAL + '?next=' + encodeURIComponent(location.origin + location.pathname));
  });
}
function denied() {
  $('#boot').classList.add('out');
  const g = document.createElement('div'); g.id = 'gate';
  g.innerHTML = `<div style="text-align:center;max-width:340px;padding:20px"><div style="font-size:40px;margin-bottom:10px">🔭</div><b style="font-size:17px">Você ainda não tem acesso a esta constelação</b><p style="color:var(--mu);font-size:13px;line-height:1.5">Peça para o mestre liberar este painel para você nos Ajustes do Quintal.</p><a class="btn pri" href="${QUINTAL}" style="text-decoration:none">Voltar ao Quintal</a></div>`;
  document.body.appendChild(g);
}
function emergencyGate(down) {
  $('#boot').classList.add('out');
  $('#gate')?.remove();
  const g = document.createElement('div'); g.id = 'gate';
  g.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><input class="gate-in" id="gate-pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Senha de emergência"><div style="font-size:11.5px;color:#85858e">${down ? 'Quintal fora do ar · senha de emergência' : 'Senha de emergência'}</div></div>`;
  document.body.appendChild(g);
  const inp = $('#gate-pin'); setTimeout(() => inp.focus(), 60);
  const tryPin = async v => { const r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pin: v }) }).catch(() => null); return !!(r && r.ok); };
  inp.addEventListener('keydown', async e => { if (e.key === 'Enter') { if (await tryPin(inp.value.trim())) location.replace(location.pathname + location.search.replace(/[?&]emergencia\b/, '')); else { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.select(); } } });
}
(async function boot() {
  let s;
  try { s = await (await fetch('/api/session', { credentials: 'same-origin' })).json(); } catch (e) { s = { down: true }; }
  if (!s.role) return lock();
  S.role = s.role; S.name = s.name || ''; S.board = s.board || 'br';
  const d = await req('/api/docs');
  S.docs = d.docs || {}; S.since = d.now || 0;
  try { S.month = localStorage.getItem('cst.month.' + B()) || nowM(); S.branch = localStorage.getItem('cst.branch') !== '0'; } catch (e) { }
  document.body.classList.toggle('ro', ro());
  $('#who').textContent = S.name;
  // primeira vez: grava os cadastros-padrão
  if (!ro()) for (const k of Object.keys(REG0)) if (!S.docs['app/reg.' + k] && REG0[k].length) put('app/reg.' + k, { items: REG0[k], upd: Date.now() }, null, true);
  UNDO.length = 0;
  S.ready = true;
  renderDock(); applyBoard(); updBranch(); updFilterBadge();
  renderWorld();
  let c = null; try { c = JSON.parse(localStorage.getItem(camKey())); } catch (e) { }
  if (c && c.k) { Object.assign(cam, c); applyCam(); } else fit(false);
  for (const n of monthNodes()) ENTER.add(n.id);
  SIG.clear(); render();
  $('#boot').classList.add('out'); setTimeout(() => $('#boot').remove(), 600);
  setInterval(poll, 5000);
})();

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Constelação de ações</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0b0d'/%3E%3Cpath d='M5 19h22' stroke='%23f4f4f5' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M11 19c0-6 4-9 9-9' stroke='%23f4f4f5' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='11' cy='19' r='3' fill='%230b0b0d' stroke='%23f4f4f5' stroke-width='2'/%3E%3Crect x='17' y='7' width='10' height='6' rx='3' fill='%23a78bfa' stroke='%23f4f4f5' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
/*BASE*/
</style>
<style>
/* ======================================================================
   Constelação de ações — peças próprias, no mesmo vocabulário do design system
   ====================================================================== */
.dot.v{background:var(--violet);box-shadow:0 0 10px rgba(167,139,250,.55)}
.dot.p{background:var(--pink);box-shadow:0 0 10px rgba(244,114,182,.55)}
.tag.v{background:rgba(167,139,250,.12);color:#ddd6fe;border-color:rgba(167,139,250,.28)}
.pill .i{width:15px;height:15px}
.pill.sm .i{width:14px;height:14px}
.top .month .month-btn{text-transform:capitalize}

/* ---------- palco da constelação ---------- */
.cvcard{padding:0;overflow:hidden}
.cv-top{display:flex;align-items:center;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
.kbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kbar .pill{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.kbar .pill:active{cursor:grabbing}
.kbar .pill.on{background:#f4f4f5;color:#111;border-color:#f4f4f5}
.kg{width:20px;height:14px;display:grid;place-items:center;flex:none;pointer-events:none}
.cv{position:relative;height:clamp(460px,66vh,860px);overflow:hidden;touch-action:none;cursor:grab;margin-top:8px}
.cv.panning{cursor:grabbing}
.cv.placing{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.fly{transition:transform .65s var(--ease)}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires .e{fill:none;stroke:#f4f4f5;stroke-width:2.6;stroke-linecap:round;transition:opacity .3s,stroke .2s}
#wires .e.dash{stroke-dasharray:2 7}
#wires .e.bridge{stroke:var(--violet);stroke-width:2;stroke-dasharray:3 9;animation:flow 1.6s linear infinite;opacity:.85}
#wires .e.sel{stroke:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.55))}
#wires .hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
#wires .elab{font:500 11px var(--font);fill:var(--text-2);paint-order:stroke;stroke:#141416;stroke-width:5px;stroke-linejoin:round}
#wires .tmp{fill:none;stroke:#f4f4f5;stroke-width:2;stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
.sp-base{stroke:var(--line-2);stroke-width:2.6;stroke-linecap:round}
.sp-done{stroke:#f4f4f5;stroke-width:2.6;stroke-linecap:round}
.sp-glow{stroke:#f4f4f5;stroke-width:12;opacity:0;transition:opacity .2s;filter:blur(7px)}
.sp-glow.on{opacity:.35}
.sp-cap{font:500 10.5px var(--font);fill:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.cv .tstart,.cv .tend{z-index:3}
.mlabel{position:absolute;transform:translate(-50%,-50%);height:40px;padding:0 22px;border-radius:12px;background:var(--node);border:1px solid var(--line);display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;color:var(--text);white-space:nowrap;box-shadow:0 24px 48px -28px rgba(0,0,0,.85)}
.mlabel .mbar{width:70px}
.mlabel small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.cv-empty{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;color:var(--text-2);font-size:12.5px;line-height:1.6;width:min(380px,80%);pointer-events:none;transition:opacity .3s}
.cv-empty.off{opacity:0}
.cvcard.full{position:fixed;inset:0;z-index:75;border-radius:0;display:flex;flex-direction:column}
.cvcard.full .cv{flex:1;height:auto}
body.cvfull{overflow:hidden}
.zseg .pill{min-width:30px}
.op-acts{flex-wrap:wrap}
@media (max-width:760px){.op-acts>.pill,.op-acts>#pendbtn{flex:1 1 100%;justify-content:center}.op-head .label{flex-wrap:wrap}}
#zl{font-variant-numeric:tabular-nums;min-width:52px;justify-content:center}

/* ---------- estrelas ---------- */
.sn{position:absolute;left:0;top:0;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .35s}
.sn-in{position:relative}
.sn.enter .sn-in{animation:snIn .55s var(--ease) both}
@keyframes snIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.sn.fresh .sn-in{animation:snFresh 1.3s var(--ease) both}
@keyframes snFresh{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1.16);filter:drop-shadow(0 0 18px var(--bc,#f4f4f5))}100%{transform:none}}
.sn.leave .sn-in{animation:snOut .3s ease-in both}
@keyframes snOut{to{opacity:0;transform:scale(.4)}}
.sn.dim{opacity:.12}
.sn.drag{z-index:6;cursor:grabbing}
.sn.drag .sn-in{transform:scale(1.06);filter:drop-shadow(0 14px 22px rgba(0,0,0,.7))}
.sn .shp{position:relative;display:flex;align-items:center;justify-content:center;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s}
.sn:not(.drag):hover .shp{transform:scale(1.06);box-shadow:0 12px 28px -8px rgba(0,0,0,.95),0 0 22px -4px var(--bc,rgba(255,255,255,.35))}
.sn.sel .shp{outline:1.5px solid #f4f4f5;outline-offset:4px}
.sn.hl .shp{animation:hlp 1.1s var(--ease) 2}
@keyframes hlp{50%{box-shadow:0 0 0 8px rgba(244,244,245,.15),0 0 30px var(--bc,#fff)}}
/* plano e trilho: a pílula da árvore de parceiros */
.k-plano .shp,.k-etapa .shp{height:32px;padding:0 14px;border-radius:999px;border:2.5px solid #fff;font-size:12.5px;font-weight:600;gap:7px;overflow:hidden;isolation:isolate;background:var(--c);color:var(--ink);box-shadow:0 8px 20px -10px rgba(0,0,0,.9)}
.k-plano.badge .shp,.k-etapa .shp{padding-left:5px}
.k-plano.prog .shp,.k-etapa .shp{background:color-mix(in srgb,var(--c) 20%,#141416);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.k-etapa.done .shp{background:var(--c);color:var(--ink);text-shadow:none}
.sn .tp-fill{position:absolute;left:0;top:0;bottom:0;width:var(--p);z-index:-1;background:var(--c);transition:width .9s var(--ease);box-shadow:4px 0 12px color-mix(in srgb,var(--c) 55%,transparent)}
.sn .tp-b{height:20px;min-width:20px;padding:0 5px;border-radius:999px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;background:rgba(0,0,0,.2)}
.k-plano.prog .tp-b,.k-etapa .tp-b{background:rgba(0,0,0,.32);color:#fff}
.sn .tp-h{overflow:hidden;text-overflow:ellipsis;max-width:220px}
.k-etapa .tp-h{max-width:none;flex:1}
.k-etapa .pct{font-size:11px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums;padding-right:2px}
/* ação */
.k-acao .shp{height:22px;padding:0 10px;border-radius:999px;background:#f4f4f5;color:#111;font-size:11px;font-weight:600;letter-spacing:.01em;gap:6px}
.k-acao .shp .dot{width:6px;height:6px}
.k-acao.done .shp{background:#4ade80;color:#06210f}
/* reunião */
.k-reuniao .shp{height:32px;padding:0 15px 0 12px;border-radius:999px;border:2px solid #f4f4f5;background:#141416;color:var(--text);font-size:12.5px;font-weight:600;gap:7px}
.k-reuniao .shp .i{width:14px;height:14px;color:var(--muted)}
/* marco */
.k-marco .shp{width:26px;height:26px;border-radius:50%;border:2.5px solid #f4f4f5;background:#141416}
.k-marco .shp::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#f4f4f5)}
.k-marco.done .shp::after{background:var(--green);box-shadow:0 0 10px rgba(74,222,128,.7)}
/* período */
.k-periodo .shp{height:8px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--c,#facc15) 0 4px,#0b0b0d 4px 8px)}
.k-periodo .brk{position:absolute;left:0;right:0;bottom:15px;height:16px;border:1.5px solid #f4f4f5;border-bottom:0;border-radius:3px 3px 0 0;pointer-events:none}
.k-periodo .plab{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--text);display:flex;align-items:center;gap:7px}
/* canal */
.k-canal .shp{width:38px;height:38px;border-radius:50%;border:2.5px solid #fff;background:var(--c,#f472b6)}
.k-canal .shp svg{width:19px;height:19px}
.k-canal .shp img{width:22px;height:22px;object-fit:contain}
/* campanha · conteúdo · meta · ideia */
.k-campanha .shp,.k-conteudo .shp,.k-meta .shp,.k-ideia .shp{width:36px;height:36px;border-radius:50%;border:2.5px solid #f4f4f5;background:#19191c;color:var(--c)}
.k-campanha .shp .i,.k-conteudo .shp .i,.k-meta .shp .i,.k-ideia .shp .i{width:17px;height:17px;stroke-width:2}
/* loja */
.k-loja .shp{gap:7px;font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--text);padding:2px 4px}
.k-loja .lg{width:22px;height:22px;display:grid;place-items:center}
.k-loja .lg svg{width:21px;height:21px}
.k-loja img.wide{height:28px;max-width:150px;object-fit:contain}
/* marca: igual ao chip da barra de marcas */
.k-marca .shp{height:30px;padding:0 11px;border-radius:9px;background:var(--node);border:1px solid var(--line);gap:8px;font-size:12px;color:var(--text)}
.k-marca .shp img{height:18px;max-width:60px;object-fit:contain}
/* time e pessoa */
.k-time .shp{gap:0;padding:2px}
.k-time .shp .av{margin-left:-7px;width:26px;height:26px;border:2px solid #141416}
.k-time .shp .av:first-child{margin-left:0}
.k-pessoa .shp .av{width:32px;height:32px;font-size:11px;border-width:2px}
.av.c{background:color-mix(in srgb,var(--c) 26%,#19191c);border-color:var(--c);color:#fff}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
/* quadro e lista */
.k-quadro .shp,.k-lista .shp{width:32px;height:32px;border-radius:9px;background:#19191c;border:1px solid var(--line-2);color:var(--text-2)}
.k-quadro .shp .i,.k-lista .shp .i{width:16px;height:16px}
/* nota */
.k-nota .shp{width:190px;white-space:normal;align-items:flex-start;justify-content:flex-start;padding:10px 12px;border-radius:12px;background:rgba(250,204,21,.07);border:1px solid rgba(250,204,21,.22);color:#fde68a;font-size:12px;line-height:1.45;text-align:left}
/* rótulos e metadados */
.lab{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);font-size:11.5px;font-weight:500;color:var(--text-2);white-space:nowrap;pointer-events:none;max-width:200px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px #000}
.smeta{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);display:flex;gap:4px;align-items:center;pointer-events:none;white-space:nowrap}
.has-lab .smeta{top:calc(100% + 25px)}
.smeta .av{width:18px;height:18px;font-size:8px;margin-left:-6px;border:1.5px solid #141416}
.smeta .av:first-child{margin-left:0}
.smeta .bd{width:7px;height:7px;border-radius:50%}
.smeta .dchip{height:18px;font-size:10px}
.sbadge{position:absolute;right:-4px;top:-4px;z-index:2}
.sbadge.ok{width:16px;height:16px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 2px #141416,0 0 10px rgba(74,222,128,.6)}
.sbadge.ok .i{width:10px;height:10px;stroke:#06210f;stroke-width:3}
.sbadge.dot{box-shadow:0 0 0 2px #141416,0 0 10px currentColor}
.cv.far .smeta,.cv.far .lab{opacity:0}
body.nodetail .smeta{display:none}
/* puxadores */
.knob{position:absolute;right:-32px;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:50%;background:#f4f4f5;color:#111;display:none;place-items:center;cursor:crosshair;box-shadow:0 0 0 5px rgba(244,244,245,.08),0 6px 16px -6px #000;z-index:3;animation:snIn .3s var(--ease) both}
.knob::before{content:"";position:absolute;inset:-12px}
.knob .i{width:13px;height:13px;stroke-width:2.4}
.sn.sel .knob{display:grid}
.grip{position:absolute;top:50%;width:12px;height:24px;margin-top:-12px;border-radius:6px;background:#f4f4f5;display:none;cursor:ew-resize;box-shadow:0 2px 8px rgba(0,0,0,.6);z-index:3}
.grip::before{content:"";position:absolute;inset:-10px}
.grip::after{content:"";position:absolute;left:4px;top:7px;width:4px;height:10px;border-left:1.5px solid #888;border-right:1.5px solid #888}
.grip.l{left:-6px}.grip.r{right:-6px}
.sn.sel .grip{display:block}
/* pontes com outros meses */
.bghost{position:absolute;transform:translate(-50%,-50%);height:28px;padding:0 11px;border-radius:9px;border:1px dashed rgba(167,139,250,.45);background:rgba(25,25,28,.9);color:var(--text-2);font-size:11.5px;display:flex;gap:7px;align-items:center;white-space:nowrap;cursor:pointer;max-width:240px;transition:border-color .2s,transform .25s var(--ease)}
.bghost:hover{border-color:var(--violet);color:var(--text);transform:translate(-50%,-50%) scale(1.04)}
.bghost b{font-weight:500;color:#c4b5fd;font-size:11px}
.bghost span{overflow:hidden;text-overflow:ellipsis}
/* barra flutuante da seleção */
.seltb{position:fixed;z-index:65;display:flex;gap:4px;padding:5px;border-radius:13px;animation:pop .2s var(--ease) both}
.seltb .pill{height:30px}
.dghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;opacity:.95;filter:drop-shadow(0 12px 22px rgba(0,0,0,.7))}

/* ---------- popovers ---------- */
.pop.fx{position:fixed}
.pop .cat-h{margin:12px 0 8px}
.pop .cat-h:first-child{margin-top:2px}
.kgrid .pill .kg{margin-left:-3px}
.pop .li{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left;color:var(--text-2);transition:background .15s,color .15s}
.pop .li:hover{background:rgba(255,255,255,.04);color:var(--text)}
.pop .li .i{color:var(--muted)}
.pop .li.d{color:#fca5a5}.pop .li.d .i{color:#fca5a5}
.pop .li small{margin-left:auto;color:var(--dim);font-size:11px}
.pop .sepl{height:1px;background:var(--line);margin:6px 2px}

/* ---------- card da estrela (modal) ---------- */
.modal.smodal{width:min(1180px,100%);padding:20px 22px}
.smodal .modal-h{margin-bottom:16px}
.smodal .modal-h h2{display:flex;align-items:center;gap:10px}
.ttl-in{width:100%;background:transparent;border:0;outline:none;font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--text);padding:2px 0}
.ttl-in::placeholder{color:var(--dim)}
.secb{scroll-margin-top:10px}
.secb+.secb{margin-top:22px}
.cat-h .acts{display:flex;gap:4px;margin-left:4px}
.cat-h .acts .pill{height:26px;width:26px}
.cat-h input{background:transparent;border:0;outline:none;color:var(--text);font-weight:500;font-size:12.5px;min-width:60px;max-width:260px}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchips .pill.on{border-color:#a1a1aa;color:var(--text);background:#2a2a30}
.kchips .pill .av{width:18px;height:18px;font-size:8px;margin-left:-5px;border-width:1px}
.kchips .pill .lgm{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;margin-left:-4px}
.kchips .pill .lgm svg{width:10px;height:10px}
.kchips .pill .lgm img{width:12px;height:12px;object-fit:contain}
.kchips .pill.add{border-style:dashed;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches button{width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid transparent;transition:transform .2s var(--ease)}
.swatches button:hover{transform:scale(1.15)}
.swatches button.on{box-shadow:0 0 0 2px #141416,0 0 0 4px var(--c)}
.swatches button.none{background:repeating-linear-gradient(45deg,#36363d 0 3px,#1f1f23 3px 6px);--c:#5a5a63}
.ck-list{display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:22px minmax(0,1fr) 150px 140px 28px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
.ck:last-child{border-bottom:0}
.ck .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:all .25s var(--ease);background:var(--well)}
.ck .bx .i{width:12px;height:12px;stroke-width:3;stroke:#06210f;opacity:0;transform:scale(.4);transition:all .25s var(--ease)}
.ck.ok .bx{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(74,222,128,.4)}
.ck.ok .bx .i{opacity:1;transform:none}
.ck .tx{background:transparent;border:0;outline:none;min-width:0;height:30px;color:var(--text)}
.ck.ok .tx{text-decoration:line-through;color:var(--muted)}
.brow{display:grid;gap:8px;align-items:start;padding:8px 0;border-top:1px solid rgba(255,255,255,.04)}
.brow:first-child{border-top:0}
.brow textarea.inp{min-height:38px;height:38px}
.lib{display:flex;flex-direction:column;gap:2px}
.lib .kchips .pill{height:32px}
.sum-r{display:flex;justify-content:flex-end;gap:10px;align-items:center;padding-top:10px;color:var(--muted)}
.sum-r b{color:var(--text)}
.cx-in{margin-top:10px}
.linkrow small{color:#c4b5fd}
.stp-i .i{width:13px;height:13px}
.side-b h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.side-b .seg{display:flex;flex-wrap:wrap;width:100%}
.side-b .seg .pill{flex:1 1 auto;justify-content:center}

/* ---------- ano ---------- */
.ygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ycard{padding:14px 14px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;animation:rise .5s var(--ease) both;animation-delay:calc(var(--d) * 35ms)}
.ycard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.ycard.cur{outline:1.5px solid #f4f4f5;outline-offset:2px}
.ycard .yh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ycard .yh b{font-size:14px;font-weight:600;text-transform:capitalize}
.ycard svg{width:100%;height:110px;display:block}
.ycard .yf{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ycard .yf .mbar{flex:1;width:auto}
.ybridges .li{cursor:pointer}
.ybridges .li:hover .lk{color:var(--text)}
@media (max-width:1280px){.ygrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1000px){.smodal .pc{grid-template-columns:minmax(0,1fr)}.smodal .pc-side{grid-template-columns:minmax(0,1fr)}.smodal .seg{flex-wrap:wrap}.smodal .fgrid{grid-template-columns:minmax(0,1fr)}.brow{grid-template-columns:minmax(0,1fr) 32px!important}.brow>:not(:last-child){grid-column:1}.brow>:last-child{grid-column:2;grid-row:1}.brow.hint{display:none}}
@media (max-width:1000px){.ygrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cv-top{padding:12px 12px 0}}
@media (max-width:760px){
  .ygrid{grid-template-columns:1fr}
  .cv{height:68dvh}
  .ck{grid-template-columns:22px minmax(0,1fr) 28px}.ck .inp{grid-column:2/3}
  .kbar .pill .kl{display:none}.kbar .pill{padding:0 9px}
}
/* ---------- ajustes ---------- */
.rl-person{grid-template-columns:30px minmax(0,1fr) minmax(0,.8fr) 140px 56px 32px}
.rl-team{grid-template-columns:14px minmax(0,1fr) 56px 32px}
.rl-chan{grid-template-columns:34px minmax(0,1fr) 56px 32px}
.rl-store{grid-template-columns:34px minmax(0,1fr) auto 56px 32px}
.rl-brand2{grid-template-columns:14px minmax(0,1fr) auto 56px 32px}
.lgbtn{width:34px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--c,#232328);border:1px solid var(--line);transition:transform .2s var(--ease)}
.lgbtn:hover{transform:scale(1.06)}
.lgbtn svg{width:16px;height:16px}
.lgbtn img{width:18px;height:18px;object-fit:contain}
.icog{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:260px;overflow:auto;margin-top:10px}
.icog button{height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid transparent;transition:transform .2s var(--ease),border-color .2s}
.icog button:hover{transform:scale(1.06);border-color:var(--line-2)}
.icog button.on{border-color:#f4f4f5}
.icog button svg{width:18px;height:18px}
@media (max-width:760px){
  .rl-person{grid-template-columns:30px minmax(0,1fr) 56px 32px}.rl-person>:nth-child(3),.rl-person>:nth-child(4){grid-column:2/-1}
  .rl-store{grid-template-columns:34px minmax(0,1fr) 56px 32px}.rl-store>:nth-child(3){grid-column:2/-1;grid-row:2}
}
</style>
</head>
<body>

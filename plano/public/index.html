<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d"><title>Plano Omnichannel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Plano"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
[hidden]{display:none!important}
:root{
  --bg:#0b0b0d; --node:#19191c; --node-2:#1f1f23; --well:#141416; --line:#2a2a30; --line-2:#36363d;
  --text:#ededf0; --text-2:#b6b6be; --muted:#85858e; --dim:#5a5a63;
  --green:#4ade80; --yellow:#facc15; --red:#f87171; --blue:#60a5fa; --violet:#a78bfa; --pink:#f472b6;
  --radius:18px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Inter","SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --gut:max(16px,min(28px,4vw));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.2px);background-size:22px 22px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
::selection{background:rgba(96,165,250,.35)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

/* ---------- topo ---------- */
.hero{display:flex;justify-content:center;padding:16px var(--gut) 0}
.hero img{display:block;width:auto;max-width:min(560px,86vw)}
.titlebar{padding:12px var(--gut) 0;display:flex;justify-content:center}
.titlebar:empty{display:none}
.title-pill{display:inline-flex;align-items:center;border-radius:999px;font-weight:600;letter-spacing:.01em;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid rgba(255,255,255,.08)}
.top{display:flex;align-items:center;gap:12px;padding:12px var(--gut);flex-wrap:wrap}
.top-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.top-l::-webkit-scrollbar{display:none}
.top-r{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-left:auto}
.pill{height:36px;padding:0 15px;border-radius:11px;background:var(--node);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;color:var(--text-2);
  transition:background .25s var(--ease),color .25s,border-color .25s,transform .2s var(--ease);white-space:nowrap}
.pill:hover{background:var(--node-2);color:var(--text)}
.pill:active{transform:scale(.97)}
.pill.on{background:#26262b;color:var(--text);border-color:var(--line-2)}
.pill.white{background:#f4f4f5;color:#111;border-color:#f4f4f5;font-weight:500}
.pill.white:hover{background:#fff}
.pill.ghost{background:transparent;border-color:transparent}
.pill.sm{height:30px;padding:0 11px;border-radius:9px;font-size:12px}
.pill.icon{width:36px;padding:0;justify-content:center}
.pill.sm.icon{width:30px}
.pill.danger{color:var(--red)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:rgba(25,25,28,.7);border:1px solid var(--line);flex:none}
.seg .pill{height:30px;border:0;background:transparent;border-radius:9px;padding:0 12px}
.seg .pill.on{background:#2a2a30;color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none;display:inline-block}
.dot.g{background:var(--green);box-shadow:0 0 10px rgba(74,222,128,.55)}
.dot.r{background:var(--red)}
.dot.o{background:var(--yellow)}
.flags .pill{padding:0 9px}.flags svg{width:22px;height:15px;border-radius:3px;display:block;opacity:.45;filter:saturate(.5);transition:opacity .2s,filter .2s}.flags .pill.on svg,.flags .pill:hover svg{opacity:1;filter:none}
.save-st{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.bdot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}

/* ---------- palco ---------- */
.wrap{flex:1;min-height:0;padding:0 var(--gut) calc(16px + env(safe-area-inset-bottom,0px));display:flex}
.stage{position:relative;flex:1;overflow:hidden;border-radius:var(--radius);border:1px solid var(--line);background-color:#0e0e11;
  background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1.25px);background-size:22px 22px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stage.grab{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
svg.wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.wire{fill:none;stroke-width:1.6;stroke-linecap:round;transition:opacity .4s var(--ease),stroke-width .3s}
.guide{position:absolute;pointer-events:none;border:0 dashed rgba(255,255,255,.28);z-index:1}
.guide.h{height:0;border-top-width:1px}.guide.v{width:0;border-left-width:1px}

/* ---------- cards do mapa ---------- */
.n{position:absolute;transform:translateY(-50%);cursor:pointer;z-index:2;transition:opacity .45s var(--ease),filter .45s}
.n-b{position:relative;display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:16px;background:linear-gradient(180deg,#1c1c20,#17171a);border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 24px 48px -28px rgba(0,0,0,.85);transition:border-color .3s,transform .3s var(--ease),box-shadow .3s}
.n:hover .n-b{border-color:var(--line-2);transform:translateY(-2px)}
.n.drag{z-index:5}.n.drag .n-b{box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 30px 60px -20px rgba(0,0,0,.95)}
.n-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.n-tx{min-width:0;flex:1}
.n-tx small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.n-tx b{display:block;font-weight:600;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.n-tx b.ph{color:var(--dim);font-weight:500}
.n-meta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.jr{display:inline-flex;gap:3px}
.jr i{width:14px;height:14px;border-radius:5px;font-size:8.5px;font-style:normal;font-weight:700;display:grid;place-items:center;background:rgba(255,255,255,.04);color:var(--dim);border:1px solid rgba(255,255,255,.06)}
.jr i.on{background:color-mix(in srgb,var(--jc) 22%,transparent);color:var(--jc);border-color:color-mix(in srgb,var(--jc) 40%,transparent)}
.qd{height:18px;padding:0 7px;border-radius:6px;font-size:10.5px;display:inline-flex;align-items:center;background:color-mix(in srgb,var(--qc) 14%,transparent);color:var(--qc)}
.cnt{font-size:11px;color:var(--muted)}
.k-depto .n-b{border-color:color-mix(in srgb,var(--c) 35%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,#1c1c20),#17171a)}
.k-depto .n-tx b{font-size:14px}
.k-programa .n-b{border-color:color-mix(in srgb,var(--c) 35%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,#1c1c20),#17171a)}
.k-programa .n-tx b{font-size:14px}
.k-objetivo .n-b{border-color:rgba(250,204,21,.35);background:linear-gradient(180deg,rgba(250,204,21,.08),#17171a)}
.k-etapa .n-b{padding:9px 12px;border-radius:13px}.k-etapa .n-ic{width:26px;height:26px;border-radius:8px}
.k-nucleo .n-b{padding:18px 18px;border-radius:22px;border-color:color-mix(in srgb,var(--c) 40%,var(--line));background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 20%,transparent),transparent 60%),linear-gradient(180deg,#1c1c20,#151518)}
.k-nucleo .n-ic{width:46px;height:46px;border-radius:15px;font-weight:700;font-size:19px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.k-nucleo .n-tx b{font-size:17px}
.n-flag{display:inline-flex;align-items:center;gap:6px;margin-top:4px;color:var(--muted);font-size:11.5px}.n-flag svg{width:16px;height:11px;border-radius:2px}
.n-add{position:absolute;right:-13px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;display:grid;place-items:center;color:var(--text);opacity:0;transform:scale(.7);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);transition:opacity .2s,transform .25s var(--ease),background .2s;z-index:3}
.n-add svg{width:13px;height:13px}
.n:hover .n-add,.n-add:focus-visible{opacity:1;transform:none}
.n-add:hover{background:rgba(255,255,255,.16)}
@media (hover:none){.n-add{opacity:.85;transform:none}}
.stage.pres .n-add{display:none}
.n-fold{position:absolute;right:-11px;top:50%;margin-top:17px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);opacity:0;transform:scale(.7);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);transition:opacity .2s,transform .25s var(--ease),background .2s;z-index:3}
.n-fold svg{width:11px;height:11px}
.n:hover .n-fold,.n-fold:focus-visible{opacity:1;transform:none}
.n-fold:hover{background:rgba(255,255,255,.14);color:var(--text)}
.n-fold.on{opacity:1;transform:none;margin-top:-12px;right:-14px;width:auto;min-width:28px;height:24px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,rgba(20,20,24,.7))}
.n.folded .n-add{display:none}
.n.folded .n-b{box-shadow:5px 5px 0 -1px #141417,5px 5px 0 0 var(--line),0 24px 48px -28px rgba(0,0,0,.85)}
@media (hover:none){.n-fold{opacity:.85;transform:none}}
.stage.pres .n-fold:not(.on){display:none}
.n.s-l .n-add{right:auto;left:-13px}.n.s-l .n-fold{right:auto;left:-11px}.n.s-l .n-fold.on{left:-14px}
.n-add.a-l{right:auto;left:-13px}
.k-nucleo.logo .n-b{padding:0;background:none;border-color:transparent;box-shadow:none;border-radius:0}
.k-nucleo.logo:hover .n-b{border-color:transparent;transform:none}
.n-logo{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 12px 30px rgba(0,0,0,.55));transition:filter .4s var(--ease)}
.k-nucleo.logo:hover .n-logo{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 35%,transparent))}
.k-nucleo.logo.cur .n-b{box-shadow:none}.k-nucleo.logo.cur .n-logo{filter:drop-shadow(0 0 30px color-mix(in srgb,var(--c) 45%,transparent))}
.rd-logo{display:block;max-height:96px;max-width:min(280px,100%);margin:2px 0 14px}
/* ---------- abas Jornada e Linha do tempo ---------- */
.pane{flex:1;min-height:0;overflow:auto;border-radius:var(--radius);border:1px solid var(--line);background-color:#0e0e11;background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1.25px);background-size:22px 22px;padding:20px 20px 70px}
.pane.in-r{animation:inR .45s var(--ease) both}.pane.in-l{animation:inL .45s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.ph-h{display:flex;align-items:flex-end;gap:12px;margin:0 2px 16px;flex-wrap:wrap}
.ph-h h2{font-size:17px;font-weight:600;letter-spacing:-.01em}.ph-h p{color:var(--muted);font-size:12px}
.jgrid{display:grid;grid-template-columns:170px repeat(4,minmax(170px,1fr));gap:8px;min-width:860px}
.jh{padding:11px 13px;border-radius:14px;color:var(--jc);background:color-mix(in srgb,var(--jc) 9%,transparent);border:1px solid color-mix(in srgb,var(--jc) 28%,transparent);display:flex;align-items:center;gap:8px}
.jh b{font-size:13px}.jh span{color:var(--muted);font-size:11.5px}.jh em{margin-left:auto;font-style:normal;font-size:11px;opacity:.8}
.jr0{padding:11px 13px;border-radius:14px;background:linear-gradient(180deg,#1c1c20,#17171a);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:5px}
.jr0 b{font-weight:600;font-size:12.5px}.jr0 span{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.jr0 span i{width:7px;height:7px;border-radius:50%;background:var(--jc);display:inline-block}
.jcell{min-height:58px;padding:7px;border-radius:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;gap:6px}
.jcell.hole{border-style:dashed;border-color:rgba(255,255,255,.09);align-items:center;justify-content:center;color:var(--dim);font-size:11px}
.sc{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:linear-gradient(180deg,#1f1f23,#19191c);border:1px solid var(--line);text-align:left;font-size:12px;color:var(--text);transition:border-color .2s,transform .25s var(--ease);width:100%}
.sc:hover{border-color:var(--line-2);transform:translateY(-2px)}
.sc i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.sc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnote{margin-top:14px;color:var(--muted);font-size:12px}
.tl{display:grid;grid-template-columns:repeat(var(--n),minmax(250px,1fr));gap:14px;align-items:start;min-width:calc(var(--n) * 260px)}
.tcol{border-radius:18px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);padding:12px;min-height:240px;transition:border-color .25s,background .25s}
.tcol.over{border-color:color-mix(in srgb,var(--qc) 55%,transparent);background:color-mix(in srgb,var(--qc) 6%,transparent)}
.th{display:flex;align-items:center;gap:8px;margin:2px 2px 4px}
.th b{height:26px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-size:12.5px;color:var(--qc);background:color-mix(in srgb,var(--qc) 13%,transparent);border:1px solid color-mix(in srgb,var(--qc) 35%,transparent)}
.th span{color:var(--muted);font-size:11.5px}
.tg{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 2px 7px;display:flex;gap:7px;align-items:center}
.tg i{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block}
.tc{width:100%;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:13px;background:linear-gradient(180deg,#1c1c20,#17171a);border:1px solid var(--line);text-align:left;margin-bottom:6px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:border-color .2s,transform .25s var(--ease),opacity .2s}
.tc:hover{border-color:var(--line-2);transform:translateY(-2px)}
.tc .n-ic{width:26px;height:26px;border-radius:8px}.tc .n-ic svg{width:13px;height:13px}
.tc b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}.tc b.ph{color:var(--dim);font-weight:500}
.tc small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tc .jr{margin-top:6px}
.tc.lift{opacity:.25}
.tc.ghost{position:fixed;z-index:90;pointer-events:none;width:260px;transform:rotate(2deg);box-shadow:0 30px 60px -20px rgba(0,0,0,.95);border-color:var(--line-2)}
.tempty{color:var(--dim);font-size:11.5px;text-align:center;padding:26px 8px;border:1px dashed rgba(255,255,255,.07);border-radius:13px;margin-top:10px}
.vseg .pill svg{width:14px;height:14px}
.n.dim{opacity:.18;filter:saturate(.3)}
.n.cur .n-b{border-color:color-mix(in srgb,var(--c) 70%,#fff 0%);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 14%,transparent),0 0 40px color-mix(in srgb,var(--c) 30%,transparent),0 24px 48px -28px rgba(0,0,0,.85)}
.n.born .n-b{animation:born .5s var(--ease) both}
@keyframes born{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

/* menu de adicionar: pills de vidro empilhadas */
.addm{position:fixed;z-index:70;display:flex;flex-direction:column;gap:6px;animation:pop .22s var(--ease) both}
.addm button{height:34px;padding:0 14px 0 10px;border-radius:12px;display:flex;align-items:center;gap:9px;color:var(--text);font-size:12.5px;white-space:nowrap;cursor:grab;touch-action:none;
  background:rgba(30,30,34,.62);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 14px 30px -14px rgba(0,0,0,.9);transition:background .2s,transform .2s var(--ease)}
.addm button:hover{background:rgba(48,48,54,.75);transform:translateX(3px)}
.addm button svg{color:var(--c)}
.addm small{color:var(--muted);font-size:11px}
.ghostn{position:fixed;z-index:75;pointer-events:none;padding:8px 12px;border-radius:12px;background:rgba(30,30,34,.8);border:1px solid rgba(255,255,255,.18);transform:translate(10px,-50%);font-size:12px}

/* doca */
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:2px;padding:5px;border-radius:18px;background:rgba(24,24,28,.62);border:1px solid rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 22px 44px -20px rgba(0,0,0,.95)}
.dock button{height:36px;min-width:36px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--text-2);transition:background .2s,color .2s,transform .25s var(--ease)}
.dock button:hover{background:rgba(255,255,255,.07);color:var(--text);transform:translateY(-3px)}
.dock button:hover svg{transform:scale(1.08)}
.dock button svg{transition:transform .25s var(--ease)}
.dock .sep{width:1px;height:22px;background:rgba(255,255,255,.08);margin:0 4px}
.dock .zl{font-size:11px;color:var(--muted);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.dock .play{color:var(--text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.stage.pres .dock{display:none}

/* vazio */
.empty{position:absolute;inset:0;display:grid;place-items:center;z-index:4;padding:20px}
.empty .node{width:min(440px,100%);padding:26px;text-align:center;animation:pop .4s var(--ease) both}
.empty h2{font-size:17px;margin:10px 0 6px}.empty p{color:var(--muted);margin-bottom:18px}
.empty .row{justify-content:center;flex-wrap:wrap}
.node{position:relative;background:linear-gradient(180deg,#1c1c20,#17171a);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 24px 48px -28px rgba(0,0,0,.85)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}

/* ---------- pop-ups ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,5,7,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.mod{width:min(600px,100%);max-height:calc(100dvh - 40px);overflow:auto;padding:20px 22px 18px;animation:pop .3s var(--ease) both;--c:#e7e7ea}
.mod.sm{width:min(480px,100%)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mh .n-ic{width:30px;height:30px}

const edNode = () => N(ED.id);

async function uploadFiles(files) {
  for (const f of files) {
    if (f.size > 20 * 1024 * 1024) { toast(f.name + ': maior que 20 MB', 'r'); continue; }
    toast('Enviando ' + f.name + '…');
    let r; try { r = await fetch('/api/files', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': f.type || 'application/octet-stream', 'x-name': encodeURIComponent(f.name), 'x-board': store.board }, body: f }); } catch (e) { r = null; }
    if (!r || !r.ok) { toast('Não foi possível enviar ' + f.name, 'r'); continue; }
    const a = await r.json(); const n = edNode(); if (!n) return; n.att = [...(n.att || []), { id: a.id, name: a.name, size: a.size, type: a.type }]; putNode(n); edPart('att', attHTML(n));

/* =================== abas Jornada e Linha do tempo =================== */
function crumbOf(n, list) { return ancestors(n, list).filter(a => !['nucleo', 'objetivo'].includes(a.kind)).map(a => a.title || KIND[a.kind].n).join(' › '); }
const deptoOf = (n, list) => ancestors(n, list).find(a => a.kind === 'depto');
function drawPane() {
  const el = $('#pane'); if (!el) return; const y = el.scrollTop;
  const list = brandNodes(), b = marca(curMarca()) || {};
  if (!curMarca()) { el.innerHTML = '<div class="tempty">Nenhuma marca cadastrada.</div>'; return; }
  if (!list.length) { el.innerHTML = `<div class="tempty">O plano da ${esc(b.name)} · ${PAIS[store.board].name} ainda está vazio.<br><br><button class="pill sm" data-act="view" data-v="mapa">${ic('tree')}Montar no mapa</button></div>`; return; }
  el.innerHTML = UI.view === 'jornada' ? vJornada(list, b) : vTempo(list, b);
  el.scrollTop = y;
}
function vJornada(list, b) {
  const offs = offOf(list), E = list.filter(n => n.kind === 'estrategia' && !offs.has(n.id)), chs = CANAIS[store.board].filter(c => E.some(n => (n.canais || []).includes(c)));
  const rows = chs.map(c => [c, E.filter(n => (n.canais || []).includes(c))]);
  const semCanal = E.filter(n => !(n.canais || []).length && (n.fase || []).length); if (semCanal.length) rows.push(['Sem canal', semCanal]);
  const semFase = E.filter(n => !(n.fase || []).length).length;
  const sc = n => `<button class="sc" data-act="open" data-v="${n.id}" style="--c:${colorOf(n, list)}" title="${esc(crumbOf(n, list))}"><i></i><span>${esc(n.title || KIND.estrategia.ph)}</span></button>`;
  const head = `<div class="ph-h"><div><h2>Jornada do cliente · ${esc(b.name)}</h2><p>Onde cada canal age — e onde está o buraco.</p></div></div>`;
  if (!rows.length) return head + `<div class="tempty">Nenhuma estratégia com jornada ainda.<br>Marque a jornada e os canais no pop-up de cada estratégia.</div>`;
  return head + `<div class="jgrid"><div></div>${JORN.map(j => `<div class="jh" style="--jc:${j[4]}"><b>${j[2]}</b><span>${j[3]}</span><em>${E.filter(n => (n.fase || []).includes(j[0])).length}</em></div>`).join('')}
    ${rows.map(([c, ns]) => { const cnt = JORN.map(j => ns.filter(n => (n.fase || []).includes(j[0])).length), mx = Math.max(...cnt);
      const cn = list.find(x => x.kind === 'canal' && norm(x.title) === norm(c) && (x.fase || []).length), pap = cn ? JORN.filter(j => cn.fase.includes(j[0])) : mx ? JORN.filter((j, i) => cnt[i] === mx) : [];
      return `<div class="jr0"><b>${esc(c)}</b><span>${pap.length ? pap.map(j => `<i style="--jc:${j[4]}"></i>${j[3]}`).join(' · ') : 'sem jornada'}</span></div>${JORN.map(j => { const cs = ns.filter(n => (n.fase || []).includes(j[0])); return cs.length ? `<div class="jcell">${cs.map(sc).join('')}</div>` : '<div class="jcell hole">sem ação</div>'; }).join('')}`; }).join('')}
  </div>${semFase ? `<p class="pnote">${semFase} ${semFase > 1 ? 'estratégias ainda não têm' : 'estratégia ainda não tem'} jornada marcada.</p>` : ''}`;

const TCOLS = [...QUANDO, ['', 'Sem prazo', '#85858e']];
function vTempo(list, b) {

  const cols = TCOLS.filter(c => c[0] || items.some(n => !n.quando));
  const card = n => { const fs = n.fase || [], st = ST[n.kind] ? stOf(n) : null, sub = [n.resp, fmtD(n.prazo || n.data || n.inicio)].filter(Boolean).join(' · '); return `<button class="tc" data-tc="${n.id}" style="--c:${colorOf(n, list)}"><span class="n-ic">${ic(n.kind)}</span><span style="min-width:0"><b class="${n.title ? '' : 'ph'}">${esc(n.title || KIND[n.kind].ph)}</b><small>${esc(crumbOf(n, list))}</small>${sub ? `<small>${esc(sub)}</small>` : ''}${n.kind === 'estrategia' && fs.length ? `<span class="jr">${JORN.map(j => `<i class="${fs.includes(j[0]) ? 'on' : ''}" style="--jc:${j[4]}">${j[1]}</i>`).join('')}</span>` : ''}${st ? `<span class="qd" style="--qc:${st[2]}">${st[1]}</span>` : ''}</span></button>`; };

    ${items.length ? `<div class="tl" style="--n:${cols.length}">${cols.map(col).join('')}</div>` : '<div class="tempty">Nada com prazo ainda. Crie estratégias, ações e campanhas no mapa pelo “+”.</div>'}`;

/* arrastar cards entre Agora / Próximo / Depois */
let TDRAG = null;

  const c = e.target.closest('.tc'); if (!c || e.button > 0) return;
  TDRAG = { id: c.dataset.tc, el: c, sx: e.clientX, sy: e.clientY, moved: false };
});
document.addEventListener('pointermove', e => {
  if (!TDRAG) return;
  if (!TDRAG.moved) { if (Math.hypot(e.clientX - TDRAG.sx, e.clientY - TDRAG.sy) < 6) return; TDRAG.moved = true; const g = TDRAG.el.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g); TDRAG.g = g; TDRAG.el.classList.add('lift'); }
  TDRAG.g.style.left = e.clientX - 30 + 'px'; TDRAG.g.style.top = e.clientY - 20 + 'px';
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.tcol');

    inp.addEventListener('input', async () => { const v = inp.value.trim(), n = ++busy; if (v.length < 4) return; if (await tryPin(v) && n === busy) { inp.disabled = true; location.replace(location.pathname); } });
    inp.addEventListener('keydown', async e => { if (e.key === 'Enter' && !(await tryPin(inp.value.trim()))) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.select(); } });
  }
  window.lockScreen = function () {
    document.body.classList.add('locked');
    if (emerg) return emergencyGate(false);
    fetch('/api/session', { credentials: 'same-origin' }).then(r => r.json()).catch(() => ({ down: true })).then(d => {
      if (d.role) { location.reload(); return; }
      if (d.down) return emergencyGate(true);
      toQuintal();
    });
  };
})();
</script>

<script>
/* glitch: embrulha o logo do topo em camadas; liga/desliga em Ajustes do Quintal */
(function () {
  const wrap = () => {
    const img = document.getElementById('hero-logo');
    if (!img || img.parentElement.classList.contains('glx')) return;
    const w = document.createElement('span'); w.className = 'glx';
    img.replaceWith(w); w.appendChild(img);
    for (const c of ['gl1', 'gl2']) { const g = img.cloneNode(); g.removeAttribute('id'); g.className = 'gl ' + c; g.alt = ''; g.setAttribute('aria-hidden', 'true'); w.appendChild(g); }
  };
  new MutationObserver(wrap).observe(document.body, { childList: true, subtree: true }); wrap();
  window.setGlitch = on => document.body.classList.toggle('noglitch', !on);
  if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost')
    fetch('/api/session', { credentials: 'same-origin' }).then(r => r.json()).then(d => { if (d && d.glitch === false) setGlitch(false); }).catch(() => {});
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
/* atualização automática: quando sai versão nova no servidor, a página recarrega sozinha assim que estiver livre */
(function autoUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  let v0 = null, want = false;
  const idle = () => !document.querySelector('.scrim') && !document.body.classList.contains('pres-on') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '');
  const go = () => { if (!want) return; if (idle()) location.reload(); };
  const check = async () => { try { const r = await fetch('/api/ver', { cache: 'no-store' }); const d = await r.json(); if (!d.v) return; if (v0 === null) v0 = d.v; else if (d.v !== v0) { want = true; go(); } } catch (e) {} };
  check(); setInterval(check, 120000); setInterval(go, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();

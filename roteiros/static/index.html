<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d"><title>Roteiros</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Roteiros"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0b0b0d; --node:#19191c; --node-2:#1f1f23; --well:#141416; --line:#2a2a30; --line-2:#36363d;
  --text:#ededf0; --text-2:#b6b6be; --muted:#85858e; --dim:#5a5a63;
  --green:#4ade80; --yellow:#facc15; --red:#f87171; --blue:#60a5fa; --pink:#f472b6; --orange:#fb923c; --violet:#a78bfa;
  --radius:18px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Inter","SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --gut:max(28px,calc((100vw - 1240px) / 2));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.2px);background-size:22px 22px;background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
::selection{background:rgba(96,165,250,.35)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
@keyframes inL{from{opacity:0;transform:translateX(-26px)}}
@keyframes inR{from{opacity:0;transform:translateX(26px)}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes fade{from{opacity:0}}

.pill{height:36px;padding:0 15px;border-radius:11px;background:var(--node);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;color:var(--text-2);
  transition:background .25s var(--ease),color .25s,border-color .25s,transform .2s var(--ease);white-space:nowrap}
.pill:hover{background:var(--node-2);color:var(--text)}
.pill:active{transform:scale(.97)}
.pill.on{background:#26262b;color:var(--text);border-color:var(--line-2)}
.pill.white{background:#f4f4f5;color:#111;border-color:#f4f4f5;font-weight:500}
.pill.white:hover{background:#fff}
.pill.sm{height:30px;padding:0 11px;border-radius:9px;font-size:12px}
.pill.icon{width:36px;padding:0;justify-content:center}.pill.sm.icon{width:30px}
.pill.danger{color:var(--red)}.pill.danger:hover{background:rgba(248,113,113,.1)}
.pill:disabled{opacity:.4;pointer-events:none}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:rgba(25,25,28,.7);border:1px solid var(--line)}
.seg .pill{height:30px;border:0;background:transparent;border-radius:9px}
.seg .pill.on{background:#2a2a30;color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none;display:inline-block}
.dot.g{background:var(--green);box-shadow:0 0 10px rgba(74,222,128,.55)}.dot.r{background:var(--red)}.dot.o{background:var(--yellow)}
.node{background:linear-gradient(180deg,#1c1c20,#17171a);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 24px 48px -28px rgba(0,0,0,.85)}
.inp{height:38px;border-radius:10px;background:var(--well);border:1px solid var(--line);padding:0 12px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
.inp:hover{border-color:var(--line-2)}
.inp:focus{border-color:#4b4b55;box-shadow:0 0 0 3px rgba(255,255,255,.05);background:#18181b}
textarea.inp{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.5}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 0 8px}
.lbl:first-child{margin-top:0}
.switch{width:34px;height:20px;border-radius:20px;background:#2a2a30;position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#85858e;transition:transform .25s var(--ease),background .25s}
.switch.on{background:var(--green)}.switch.on::after{transform:translateX(14px);background:#0b0b0d}
.muted{color:var(--muted)}

/* ---------- topo ---------- */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px var(--gut) 6px}
.hero img{display:block;width:auto;max-width:min(560px,86vw);animation:viewIn .6s var(--ease) both}
.title-pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-radius:999px;background:var(--node);border:1px solid var(--line);font-weight:600;font-size:13.5px;letter-spacing:.01em}
.tabs{position:sticky;top:0;z-index:40;display:flex;justify-content:center;padding:12px var(--gut);background:linear-gradient(180deg,rgba(11,11,13,.92),rgba(11,11,13,.0));}
.tabbar{display:inline-flex;align-items:center;gap:2px;padding:5px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 18px 40px -20px rgba(0,0,0,.9)}
.tabbar .tb{height:34px;padding:0 14px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;color:var(--muted);transition:color .25s,background .25s,transform .25s var(--ease)}
.tabbar .tb:hover{color:var(--text);transform:translateY(-3px)}
.tabbar .tb:hover svg{transform:scale(1.1)}
.tabbar .tb svg{transition:transform .25s var(--ease)}
.tabbar .tb.on{background:rgba(255,255,255,.09);color:var(--text)}
.tabbar .sep{width:1px;height:18px;background:rgba(255,255,255,.1);margin:0 4px}
.savest{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);padding:0 8px;white-space:nowrap}
main{padding:10px var(--gut) 110px}
.view{animation:viewIn .45s var(--ease) both}.view.l{animation-name:inL}.view.r{animation-name:inR}

/* ---------- manual ---------- */
.man{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
.man-nav{position:sticky;top:74px;padding:10px;display:flex;flex-direction:column;gap:2px}
.man-nav a{display:block;padding:8px 11px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12.5px;transition:background .2s,color .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.man-nav a:hover{background:rgba(255,255,255,.05);color:var(--text)}
.man-body{min-width:0;display:flex;flex-direction:column;gap:16px}
.man-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);position:sticky;top:66px;z-index:30}
.man-tools .sp{flex:1}
.man-tools .hint{font-size:11.5px;color:var(--muted);padding:0 6px}
.sec{position:relative;padding:28px 30px;scroll-margin-top:84px;font-size:14px;line-height:1.7;color:var(--text-2)}
.sec h2{font-size:21px;line-height:1.3;color:var(--text);margin:0 0 14px;letter-spacing:-.01em}
.sec h3{font-size:15px;color:var(--text);margin:22px 0 6px}
.sec p{margin:9px 0}.sec ul{margin:8px 0 8px 20px}.sec li{margin:5px 0}
.sec b,.sec strong{color:var(--text)}
.sec a{color:var(--blue)}
.sec table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.sec td,.sec th{text-align:left;vertical-align:top;padding:11px 8px;border-bottom:1px solid var(--line)}
.sec th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec .tw{overflow-x:auto}
.sec .tag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;margin:3px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--text)}
.sec .flow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:18px 0}
.sec .flow .st{padding:7px 12px;border-radius:999px;font-size:12.5px;background:var(--well);border:1px solid var(--line);color:var(--text)}
.sec .flow .ar{color:var(--dim)}
.sec .note{font-size:12.5px;color:var(--muted)}
.sec .warn{padding:10px 14px;border-radius:12px;background:rgba(250,204,21,.07);border:1px solid rgba(250,204,21,.22);color:#fde68a}
.msg{position:relative;margin:14px 0;padding:14px 16px 14px 18px;border-radius:14px;background:var(--well);border:1px solid var(--line);color:var(--text);font-size:14px}
.msg::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--green)}
.msg p{margin:0;white-space:pre-wrap}
.msg p:empty::before{content:"Cole aqui a mensagem…";color:var(--dim)}
.msg .cp{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .2s}
.msg:hover .cp,.msg .cp:focus-visible{opacity:1}
.cp{height:28px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);transition:background .2s,color .2s}
.cp:hover{background:rgba(255,255,255,.1);color:var(--text)}
.cp svg{width:13px;height:13px}
.jump{margin-top:12px}
body.editing .sec{outline:1px dashed rgba(255,255,255,.14);outline-offset:-6px}
body.editing .sec:focus-within{outline-color:rgba(74,222,128,.45)}
.sec [contenteditable=true]{outline:none}
.sec .del{position:absolute;top:12px;right:12px}
@media (max-width:860px){.man{grid-template-columns:1fr}.man-nav{position:static;flex-direction:row;flex-wrap:wrap}.man-nav a{padding:6px 10px}.sec{padding:22px 18px}}

/* ---------- fluxos ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.bar .sp{flex:1}
.bar .inp{width:220px;height:36px}
.fgrid{columns:2 380px;column-gap:16px}
.fcard{break-inside:avoid;margin:0 0 16px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:pop .4s var(--ease) both}
.fhead{display:flex;align-items:center;gap:10px}
.fhead h3{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead h3.ph{color:var(--dim);font-weight:500}
.fhead.ed{cursor:pointer;border-radius:12px;margin:-6px;padding:6px;transition:background .2s}
.fhead.ed:hover{background:rgba(255,255,255,.04)}
.ftag{height:22px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;font-size:11px;font-weight:600;flex:none}
.ftag.A{background:rgba(96,165,250,.14);color:#93c5fd}.ftag.B{background:rgba(244,114,182,.14);color:#f9a8d4}.ftag.G{background:rgba(255,255,255,.07);color:var(--text-2)}
.fcount{font-size:11.5px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:6px}
.bub{max-width:88%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;position:relative}
.bub.p{align-self:flex-start;background:var(--well);border:1px solid var(--line);color:var(--text-2);border-bottom-left-radius:6px}
.bub.m{align-self:flex-end;background:#e9e9ec;color:#141416;border-bottom-right-radius:6px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.bub.m:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(255,255,255,.35)}
.bub.m::after{content:"copiar";position:absolute;right:10px;top:-9px;font-size:10px;padding:1px 7px;border-radius:999px;background:#2a2a30;color:var(--text-2);opacity:0;transition:opacity .2s}
.bub.m:hover::after{opacity:1}
.bub.m.ok::after{content:"copiado ✓";opacity:1;color:var(--green)}
.fempty{color:var(--dim);font-size:12.5px;padding:6px 2px}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:60px 20px;color:var(--muted)}

/* ---------- gerador ---------- */
.gen{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.gctl{padding:20px;position:sticky;top:74px}
.gctl .seg{display:flex}.gctl .seg .pill{flex:1;justify-content:center;padding:0 8px}
.gctl .row{display:flex;align-items:center;gap:10px}
.gctl .go{width:100%;justify-content:center;height:42px;margin-top:20px;font-size:13.5px}
.gnote{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.5}
.glist{display:flex;flex-direction:column;gap:10px}
.gitem{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 18px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);cursor:pointer;
  font-size:14.5px;line-height:1.5;transition:transform .25s var(--ease),background .25s,border-color .25s,opacity .3s;animation:pop .45s var(--ease) both;animation-delay:calc(var(--d) * 45ms)}
.gitem:hover{transform:translateY(-3px);background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}
.gitem .tx{flex:1;min-width:0}
.gitem .ln{font-size:10.5px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.gitem.used{opacity:.45}
.gitem.used .cp{color:var(--green)}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:36px}
.ghead h3{font-size:14px;font-weight:600;flex:1}
@media (max-width:860px){.gen{grid-template-columns:1fr}.gctl{position:static}}

/* ---------- modal / toast / gate ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,5,7,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .25s both}
.modal{width:min(640px,100%);max-height:calc(100dvh - 40px);overflow:auto;padding:22px;animation:pop .35s var(--ease) both}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-h .tit{flex:1;height:40px;font-size:16px;font-weight:600;background:transparent;border-color:transparent;padding:0 10px;margin-left:-10px}
.modal-h .tit:hover{border-color:var(--line)}
.modal-f{display:flex;align-items:center;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.modal-f .sp{flex:1}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.step .who{display:flex;flex-direction:column;gap:4px}
.step .who .pill{height:26px;padding:0 9px;font-size:11px;border-radius:8px;justify-content:center}
.step .who .pill.on.m{background:#f4f4f5;color:#111;border-color:#f4f4f5}
.step textarea.inp{min-height:56px}
.step .acts{display:flex;flex-direction:column;gap:4px}
.step .acts .pill{width:26px;height:26px;padding:0;border-radius:8px;justify-content:center}
.step .acts svg{width:13px;height:13px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 16px;border-radius:12px;background:#222226;border:1px solid var(--line-2);display:flex;gap:9px;align-items:center;box-shadow:0 20px 40px -10px rgba(0,0,0,.7);animation:pop .3s var(--ease) both}
.toast .dot{background:var(--green)}.toast.r .dot{background:var(--red)}
.s-ask{width:min(380px,100%);padding:22px;animation:pop .3s var(--ease) both}
.s-ask h3{font-size:14.5px;font-weight:600;margin-bottom:18px;line-height:1.45}
.s-ask .row{display:flex;gap:8px;justify-content:flex-end}
.s-dg{background:#f87171!important;color:#1a0505!important;border-color:#f87171!important;font-weight:600}
.gearfab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#85858e;background:rgba(25,25,28,.85);border:1px solid #2a2a30;backdrop-filter:blur(10px);transition:color .3s,transform .5s var(--ease)}
.gearfab:hover{color:#ededf0;transform:rotate(60deg)}.gearfab svg{width:20px;height:20px}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body.locked #app{filter:blur(18px) saturate(.7);pointer-events:none;user-select:none}
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(8,8,10,.35);animation:fade .35s both}
.gate-in{width:min(220px,80vw);height:54px;border-radius:16px;background:rgba(25,25,28,.85);border:1px solid var(--line-2);color:var(--text);text-align:center;font-size:22px;letter-spacing:.5em;padding-left:.5em;outline:none;-webkit-text-security:disc;animation:pop .45s var(--ease) both}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (max-width:640px){
  main{padding:8px 14px 110px}.hero{padding:18px 14px 2px}.tabs{padding:10px 10px}
  .tabbar .tb span{display:none}.tabbar .tb{padding:0 12px}
  .bar .inp{width:100%}.fgrid{columns:1}
  .scrim{align-items:end;padding:0}.modal{width:100%;max-height:94dvh;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.tabs,.man-nav,.man-tools,.gearfab,.cp,.toasts,.hero{display:none!important}body{background:#fff;color:#111}.man{display:block}.sec{background:none;border:0;box-shadow:none;color:#222;padding:10px 0;break-inside:avoid}.sec h2,.sec h3,.sec b,.sec strong,.msg{color:#111}.msg{background:#f5f5f5;border-color:#ddd}}

/* glitch no logo (liga/desliga em Ajustes do Quintal) */
.glx{position:relative;display:inline-block;line-height:0;isolation:isolate}
.glx>img{position:relative;z-index:1}
.glx .gl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:2;object-fit:contain}
.glx .gl1{filter:drop-shadow(3px 0 0 rgba(255,0,110,.95)) drop-shadow(-1px 0 0 rgba(255,0,110,.6));animation:glx1 4.7s steps(1,end) infinite}
.glx .gl2{filter:drop-shadow(-3px 0 0 rgba(0,255,240,.95)) drop-shadow(1px 0 0 rgba(0,255,240,.6));animation:glx2 6.1s steps(1,end) infinite}
.glx>img:first-child{animation:glx0 4.7s steps(1,end) infinite}
.glx:hover .gl1{animation-duration:.9s}.glx:hover .gl2{animation-duration:1.15s}.glx:hover>img:first-child{animation-duration:.9s}
@keyframes glx0{0%,88%,100%{transform:none}89%{transform:translate(-2px,0) skewX(-4deg)}91%{transform:translate(2px,0)}93%{transform:translate(-1px,1px) skewX(3deg)}95%{transform:none}}
@keyframes glx1{0%,87%{opacity:0;clip-path:inset(0 0 100% 0)}88%{opacity:1;clip-path:inset(12% 0 70% 0);transform:translate(-6px,0)}90%{clip-path:inset(55% 0 20% 0);transform:translate(5px,0)}92%{clip-path:inset(30% 0 52% 0);transform:translate(-3px,0)}94%{clip-path:inset(78% 0 4% 0);transform:translate(7px,0)}96%{clip-path:inset(4% 0 85% 0);transform:translate(-4px,0)}98%{opacity:0}100%{opacity:0}}
@keyframes glx2{0%,90%{opacity:0;clip-path:inset(0 0 100% 0)}91%{opacity:1;clip-path:inset(62% 0 18% 0);transform:translate(6px,0)}93%{clip-path:inset(18% 0 66% 0);transform:translate(-5px,0)}95%{clip-path:inset(44% 0 38% 0);transform:translate(4px,0)}97%{clip-path:inset(85% 0 2% 0);transform:translate(-7px,0)}99%{opacity:0}100%{opacity:0}}
body.noglitch .glx .gl{display:none}body.noglitch .glx>img:first-child{animation:none}
@media (prefers-reduced-motion:reduce){.glx .gl{display:none}}
</style></head><body>
<div id="app"></div><div class="toasts" id="toasts"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = { role: null, name: '', docs: {}, since: 0, queue: {}, saving: false };
const isAdmin = () => store.role === 'admin';
const D = p => store.docs[p];
async function api(path, opt = {}) {
  let r; try { r = await fetch(path, { credentials: 'same-origin', ...opt, headers: { 'content-type': 'application/json', ...(opt.headers || {}) } }); } catch (e) { return { ok: false, status: 0, data: {} }; }
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (r.status === 401) { store.role = null; window.lockScreen && lockScreen(); }
  return { ok: r.ok, status: r.status, data };
}
function commit(path, body) {
  if (body === null) delete store.docs[path]; else store.docs[path] = body;
  store.queue[path] = body; clearTimeout(commit.t); commit.t = setTimeout(flush, 500); savest('Salvando…');
}
async function flush() {
  if (store.saving) return; const ops = Object.entries(store.queue).map(([path, body]) => ({ path, body })); if (!ops.length) return;
  store.queue = {}; store.saving = true;
  const r = await api('/api/docs', { method: 'POST', body: JSON.stringify({ ops }) });
  store.saving = false;
  if (!r.ok) { ops.forEach(o => { if (!(o.path in store.queue)) store.queue[o.path] = o.body; }); savest(r.status === 403 ? 'Sem permissão' : 'Erro ao salvar'); if (r.status === 403) toast('Só o admin altera isso', 'r'); else setTimeout(flush, 4000); return; }
  savest('Salvo'); if (Object.keys(store.queue).length) flush();
}
const savest = t => { const el = $('#savest'); if (el) el.innerHTML = t ? `<span class="dot ${/Salvo/.test(t) ? 'g' : /Erro|Sem/.test(t) ? 'r' : 'o'}"></span>${t}` : ''; };
const busyTyping = () => /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '') || document.activeElement?.isContentEditable;
async function poll() {
  if (document.hidden) return;
  const r = await api('/api/changes?since=' + store.since); if (!r.ok) return;
  let ch = false;
  for (const [k, v] of Object.entries(r.data.docs || {})) { if (k in store.queue) continue; if (UI.editing && k === 'app/manual') continue; if (v === null) delete store.docs[k]; else store.docs[k] = v; ch = true; }
  store.since = r.data.now;
  if (ch && !UI.editing && !busyTyping() && !$('.scrim')) renderView(false);
}

  if (a === 'copy-msg') { const m = b.closest('.msg'), p = m.cloneNode(true); $$('[data-x]', p).forEach(x => x.remove()); if (await copyText(p.innerText.trim())) { b.innerHTML = ic('check') + 'Copiada'; setTimeout(() => b.innerHTML = ic('copy') + 'Copiar', 1800); } return; }

function toast(msg, k = 'w') { const t = document.createElement('div'); t.className = 'toast ' + k; t.innerHTML = `<span class="dot"></span>${esc(msg)}`; $('#toasts').appendChild(t); setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2400); }
function ask(title, ok = 'Excluir') {
  return new Promise(res => {
    const s = document.createElement('div'); s.className = 'scrim c-askscrim'; s.style.zIndex = 85;
    s.innerHTML = `<div class="node s-ask"><h3>${esc(title)}</h3><div class="row"><button class="pill" data-a="0">Cancelar</button><button class="pill ${/Excluir|Remover/.test(ok) ? 's-dg' : 'white'}" data-a="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(s); const done = v => { s.remove(); document.removeEventListener('keydown', kd, true); res(v); };
    const kd = ev => { if (ev.key === 'Escape') { ev.stopPropagation(); done(false); } };
    document.addEventListener('keydown', kd, true);
    s.addEventListener('mousedown', ev => { if (ev.target === s) done(false); });
    s.querySelectorAll('[data-a]').forEach(x => x.addEventListener('click', ev => { ev.stopPropagation(); done(x.dataset.a === '1'); }));
    setTimeout(() => s.querySelector('[data-a="0"]').focus(), 30);
  });
}

<script>
/* login único pelo Quintal do CAO(S) */
(function () {
  if (!/^https?:$/.test(location.protocol)) return;
  const QUINTAL = 'https://meucaos.com/';
  const emerg = /[?&]emergencia\b/.test(location.search);
  const toQuintal = () => location.replace(QUINTAL + '?next=' + encodeURIComponent(location.origin + location.pathname));
  function emergencyGate(down) {
    document.getElementById('gate')?.remove();
    const g = document.createElement('div'); g.id = 'gate';
    g.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><input class="gate-in" id="gate-pin" type="text" inputmode="numeric" autocomplete="off" aria-label="Senha de emergência"><div style="font-size:11.5px;color:#85858e">${down ? 'Quintal fora do ar · senha de emergência' : 'Senha de emergência'}</div></div>`;
    document.body.appendChild(g);
    const inp = document.getElementById('gate-pin'); setTimeout(() => inp.focus(), 60);
    const tryPin = async v => { const r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: 'admin', pin: v }) }).catch(() => null); return !!(r && r.ok); };
    inp.addEventListener('keydown', async e => { if (e.key !== 'Enter') return; if (await tryPin(inp.value.trim())) location.replace(location.pathname); else { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.select(); } });
  }
  window.lockScreen = function () {
    document.body.classList.add('locked');
    if (emerg) return emergencyGate(false);
    fetch('/api/session', { credentials: 'same-origin' }).then(r => r.json()).catch(() => ({ down: true })).then(d => {
      if (d.role) { location.reload(); return; }
      if (d.down) return emergencyGate(true);
      toQuintal();
    });
  };
})();

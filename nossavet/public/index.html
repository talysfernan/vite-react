<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d"><title>nossavet</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="nossavet"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0b0b0d; --node:#19191c; --node-2:#1f1f23; --well:#141416; --line:#2a2a30; --line-2:#36363d;
  --text:#ededf0; --text-2:#b6b6be; --muted:#85858e; --dim:#5a5a63;
  --green:#4ade80; --yellow:#facc15; --red:#f87171; --blue:#60a5fa; --orange:#fb923c; --violet:#a78bfa; --teal:#2dd4bf; --pink:#f472b6;
  --nv-g:#0bde86; --nv-b:#205fd4;
  --radius:18px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Inter","SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --glass:rgba(255,255,255,.05); --glass-b:rgba(255,255,255,.12);
  --gut:max(20px,calc((100vw - 1320px) / 2));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.2px);background-size:22px 22px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
::selection{background:rgba(96,165,250,.35)}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}
.sub{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono);font-size:11.5px}
.num{font-variant-numeric:tabular-nums}

/* ---------- controles ---------- */
.pill{height:36px;padding:0 15px;border-radius:11px;background:var(--node);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--text-2);white-space:nowrap;
  transition:background .25s var(--ease),color .25s,border-color .25s,transform .2s var(--ease)}
.pill:hover{background:var(--node-2);color:var(--text)}
.pill:active{transform:scale(.97)}
.pill.white{background:#f4f4f5;color:#111;border-color:#f4f4f5;font-weight:500}
.pill.white:hover{background:#fff}
.pill.sm{height:30px;padding:0 11px;border-radius:9px;font-size:12px}
.pill.icon{width:36px;padding:0}
.pill.sm.icon{width:30px}
.pill.danger{color:var(--red)}
.pill.danger:hover{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.35)}
.pill.ok{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.4);color:#bbf7d0}
.pill.ok:hover{background:rgba(74,222,128,.22)}
.pill:disabled{opacity:.4;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.inp{height:38px;width:100%;border-radius:10px;background:var(--well);border:1px solid var(--line);padding:0 12px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea.inp{height:auto;min-height:74px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{border-color:#4a4a52;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.inp::placeholder{color:var(--dim)}
.inp:disabled{opacity:.6}
input[type=date].inp{color-scheme:dark}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#85858e 50%),linear-gradient(135deg,#85858e 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.switch{width:34px;height:20px;border-radius:20px;background:#2a2a30;position:relative;flex:none;transition:background .25s var(--ease)}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#85858e;transition:transform .25s var(--ease),background .25s}
.switch.on{background:rgba(74,222,128,.85)}
.switch.on::after{transform:translateX(14px);background:#0b0b0d}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none;display:inline-block}
.node{background:linear-gradient(180deg,#1c1c20,#17171a);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 24px 48px -28px rgba(0,0,0,.85)}
.chip{height:28px;padding:0 11px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease);white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.08);color:var(--text)}
.chip.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:var(--text)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip .i{width:13px;height:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:500;color:var(--c,#b6b6be);background:color-mix(in srgb,var(--c,#85858e) 14%,transparent);border:1px solid color-mix(in srgb,var(--c,#85858e) 30%,transparent);white-space:nowrap}
.tag .dot{background:var(--c);box-shadow:0 0 8px var(--c)}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px var(--gut);padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top-l{display:flex;align-items:center;min-width:0}
.top-r{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.tb{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:14px}
.tb .sep{width:1px;height:18px;background:rgba(255,255,255,.1);margin:0 4px}
.tb button{height:30px;padding:0 11px;border-radius:10px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;transition:color .2s,background .2s,transform .25s var(--ease)}
.tb button .i{transition:transform .25s var(--ease)}
.tb button:hover{color:var(--text);transform:translateY(-3px)}
.tb button:hover .i{transform:scale(1.1)}
.tb button.on{color:var(--text);background:rgba(255,255,255,.09)}
.tb button .bdg{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:rgba(250,204,21,.18);color:#fde68a;font-size:10.5px;display:inline-grid;place-items:center}
.flags{display:inline-flex;gap:2px;padding:3px;border-radius:12px}
.flags button{width:34px;height:26px;border-radius:8px;display:grid;place-items:center;transition:background .2s}
.flags button svg{width:20px;height:14px;border-radius:3px;display:block;opacity:.4;filter:saturate(.4);transition:opacity .2s,filter .2s}
.flags button.on{background:rgba(255,255,255,.1)}
.flags button.on svg,.flags button:hover svg{opacity:1;filter:none}
.savest{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:16px}
.savest .dot.g{background:var(--green)}.savest .dot.r{background:var(--red)}.savest .dot.o{background:var(--yellow)}

/* ---------- semana ---------- */
.wkv{min-height:calc(100vh - 64px);min-height:calc(100dvh - 64px);display:flex;flex-direction:column;align-items:center;padding:6px var(--gut) 120px}
.wkh{display:flex;flex-direction:column;align-items:center;gap:9px}
.wkr{display:flex;align-items:center;gap:10px}
.wkr .nav{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s,transform .2s var(--ease)}
.wkr .nav:hover{color:var(--text);background:rgba(255,255,255,.06)}
.tpill{min-width:226px;height:34px;padding:0 22px;border-radius:9px;background:#1f1f23;border:1px solid #3a3a41;color:#f4f4f5;font-weight:600;font-size:14px;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 30px -14px rgba(0,0,0,.9);transition:border-color .2s}
.tpill:hover{border-color:#4a4a52}
.tpill .dot{background:var(--green);box-shadow:0 0 10px rgba(74,222,128,.6)}
.wks{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.wks b{color:var(--text-2);font-weight:500}
.fio-w{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:40px 0}
.fio{width:min(960px,100%);display:flex;align-items:flex-start;position:relative}
.slot{width:72px;flex:none;display:flex;flex-direction:column;align-items:center;position:relative}
.wire{flex:1;height:52px;display:flex;align-items:center;padding:0 30px}
.wire i{display:block;width:100%;height:1.5px;border-radius:2px;background:rgba(237,237,240,.8);position:relative;overflow:hidden}
.wire i::after{content:"";position:absolute;inset:0;background:var(--green);box-shadow:0 0 12px rgba(74,222,128,.8);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease)}
.wire.done i::after{transform:scaleX(1)}
.nd{width:72px;height:52px;display:grid;place-items:center;border-radius:14px;position:relative;transition:transform .35s var(--ease)}
.nd svg{width:66px;height:42px;overflow:visible;transition:filter .3s}
.nd:hover{transform:translateY(-3px) scale(1.06)}
.nd:active{transform:scale(.97)}
.nd .late{position:absolute;right:-2px;top:0;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--bg),0 0 10px rgba(248,113,113,.8)}
.nd.empty svg{opacity:.75}
.nd.empty:hover svg{opacity:1}
.lab{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:230px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;pointer-events:none}
.lab .lt{font-size:13.5px;font-weight:500;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lab .lt.ph{color:var(--dim);font-weight:400}
.lab .lm{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;align-items:center}
.lab .lm .pd{display:inline-flex;align-items:center;gap:5px}
.lab .lk{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.lab .lw{font-size:11px;color:#fca5a5}
.foot-logo{display:flex;justify-content:center;padding-top:10px}
.foot-logo img{display:block;width:auto}
.wkv .foot-logo{margin-top:auto}
.page .foot-logo{padding:48px 0 30px}

/* lista de opções (pills vitrificadas) */
.hov{position:fixed;z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(-50%);animation:hovIn .22s var(--ease) both}
.hov .hp{height:32px;max-width:260px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);
  background:rgba(30,30,34,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 12px 30px -12px rgba(0,0,0,.8);
  transition:background .2s,transform .2s var(--ease)}
.hov .hp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hov .hp:hover{background:rgba(255,255,255,.14);transform:scale(1.04)}
.hov .hp.first{background:rgba(255,255,255,.12);font-weight:500}
.hov .hk{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
@keyframes hovIn{from{opacity:0;transform:translateX(-50%) translateY(6px) scale(.96)}}

/* ---------- páginas ---------- */
.page{padding:8px var(--gut) 0;animation:pgIn .35s var(--ease) both}
.wkv{animation:pgIn .35s var(--ease) both}
.page.from-l,.wkv.from-l{animation-name:pgInL}
@keyframes pgIn{from{opacity:0;transform:translateX(14px)}}
@keyframes pgInL{from{opacity:0;transform:translateX(-14px)}}
.phd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.phd h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.phd .sub{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{padding:16px;text-align:left;display:flex;flex-direction:column;gap:9px;transition:transform .3s var(--ease),border-color .25s;min-width:0}
.card:hover{transform:translateY(-3px);border-color:var(--line-2)}
.card h3{font-size:14px;font-weight:600;line-height:1.35}
.card p{color:var(--text-2);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card ol{padding-left:17px;color:var(--text-2);font-size:12px;display:flex;flex-direction:column;gap:2px}
.card .pdot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#0b0b0d;flex:none}
.empty-st{padding:46px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-st .i{width:26px;height:26px;color:var(--dim)}

/* resultados */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{padding:16px}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.box{padding:18px;margin-bottom:14px}
.box h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.box .bsub{font-size:12px;color:var(--dim);margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:500;text-align:left;padding:0 10px 8px}
.tbl td{padding:10px;border-top:1px solid rgba(255,255,255,.05);vertical-align:middle}
.tbl tr.cl{cursor:pointer}
.tbl tr.cl:hover td{background:rgba(255,255,255,.025)}
.tbl .r{text-align:right}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.06);display:flex;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
.warn{color:#fde68a;font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.warn.r{color:#fca5a5}
.rk{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.06);color:var(--text-2)}
.rk.g{background:rgba(250,204,21,.16);color:#fde68a}

/* ajustes */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sets .box{margin:0;display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span{font-size:11.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* engrenagem */
.gearfab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#85858e;background:rgba(25,25,28,.85);border:1px solid #2a2a30;backdrop-filter:blur(10px);transition:color .3s,transform .5s var(--ease)}
.gearfab:hover,.gearfab.on{color:#ededf0;transform:rotate(60deg)}.gearfab svg{width:20px;height:20px}

/* ---------- pop-up ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,5,7,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .25s both}
.md{width:min(760px,100%);max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);display:flex;flex-direction:column;overflow:hidden;animation:pop .32s var(--ease) both}
.md.narrow{width:min(560px,100%)}
.md-h{padding:18px 20px 0;position:relative}
.md-k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;padding-right:40px;flex-wrap:wrap}
.md-k svg.flag{width:16px;height:11px;border-radius:2px}
.md-x{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.md-x:hover{background:rgba(255,255,255,.07);color:var(--text)}
.md-t{width:100%;background:none;border:0;outline:none;font-size:21px;font-weight:600;letter-spacing:-.015em;padding:8px 0 4px;color:var(--text)}
.md-t::placeholder{color:#4a4a52}
.md-t:disabled{opacity:1}
.steps{display:flex;align-items:center;margin:12px 0 2px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.steps::-webkit-scrollbar{display:none}
.stp{display:flex;align-items:center;gap:6px;flex:none;font-size:11.5px;color:var(--dim);padding:4px 2px;transition:color .2s}
.stp .sd{width:9px;height:9px;border-radius:50%;border:1.5px solid #4a4a52;transition:all .3s var(--ease)}
.stp.done{color:var(--muted)}.stp.done .sd{background:var(--c);border-color:var(--c)}
.stp.cur{color:var(--text);font-weight:500}.stp.cur .sd{background:var(--c);border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent),0 0 12px var(--c)}
.stp.can:hover{color:var(--text)}
.stp:not(.can){cursor:default}
.stl{width:18px;height:1px;background:#33333a;flex:none;margin:0 4px}
.stl.done{background:#55555e}
.tabs{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.tabs button{height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;position:relative;transition:color .2s}
.tabs button::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--text);transform:scaleX(0);transition:transform .3s var(--ease)}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text)}
.tabs button.on::after{transform:scaleX(1)}
.tabs .cnt{font-size:10.5px;min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.07);display:inline-grid;place-items:center;color:var(--text-2)}
.tabs .cnt.g{background:rgba(74,222,128,.16);color:#bbf7d0}
.tabs .cnt.y{background:rgba(250,204,21,.16);color:#fde68a}
.md-b{flex:1;overflow-y:auto;padding:18px 20px 22px;overscroll-behavior:contain}
.md-b.in-r>.tb-in{animation:tabR .3s var(--ease) both}
.md-b.in-l>.tb-in{animation:tabL .3s var(--ease) both}
@keyframes tabR{from{opacity:0;transform:translateX(18px)}}
@keyframes tabL{from{opacity:0;transform:translateX(-18px)}}
.sec{margin-bottom:20px}
.sec:last-child{margin-bottom:0}
.sec>h4{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec>h4 .h-s{text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim);font-size:11.5px}
.sec .hint{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.md-f{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.12);flex-wrap:wrap}
.flag-aj{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.28);color:#fed7aa;margin-bottom:16px;font-size:12.5px}
.flag-aj .i{color:var(--orange);margin-top:1px}
/* produtos ligados */
.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--well);border:1px solid var(--line)}
.prow b{font-weight:500}
.prow .sub{font-size:11.5px}
.seg2{display:inline-flex;padding:3px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.seg2 button{height:24px;padding:0 9px;border-radius:7px;font-size:11.5px;color:var(--muted);transition:background .2s,color .2s}
.seg2 button.on{background:rgba(255,255,255,.12);color:var(--text)}
.xb{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--dim);transition:color .2s,background .2s}
.xb:hover{color:var(--red);background:rgba(248,113,113,.08)}
.xb .i{width:14px;height:14px}
/* base dos produtos */
.base{border-radius:14px;border:1px dashed rgba(255,255,255,.12);padding:12px 14px;margin-bottom:20px;background:rgba(255,255,255,.015)}
.base summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
.base summary::-webkit-details-marker{display:none}
.base summary .i{transition:transform .25s var(--ease);width:13px;height:13px}
.base[open] summary .i{transform:rotate(90deg)}
.base .bp{margin-top:12px}
.base .bp b{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px}
.base .bp p{color:var(--text-2);font-size:12px;margin:4px 0 6px}
.base .bp ol{padding-left:18px;color:var(--text-2);font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
/* arquivos */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.02);color:var(--muted);text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:rgba(11,222,134,.55);background:rgba(11,222,134,.05);color:var(--text)}
.drop .i{width:22px;height:22px}
.drop b{color:var(--text);font-weight:500}
.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.file{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:11px;background:var(--well);border:1px solid var(--line)}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file a{text-decoration:none}
.lnk{display:grid;grid-template-columns:150px 1fr auto auto;gap:6px;align-items:center;margin-top:6px}
/* aprovação */
.chk{display:flex;flex-direction:column;gap:6px}
.chk-r{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--well);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .2s}
.chk-r:hover{border-color:var(--line-2)}
.chk-r b{font-weight:500;display:block}
.chk-r .sub{font-size:11.5px}
.chk-r>div{flex:1}
.chk-r:disabled{opacity:.7;cursor:default}
.apr{border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--well);display:flex;flex-direction:column;gap:10px}
.apr.y{border-color:rgba(250,204,21,.3);background:rgba(250,204,21,.05)}
.apr.g{border-color:rgba(45,212,191,.3);background:rgba(45,212,191,.05)}
.apr .at{display:flex;align-items:center;gap:9px;font-weight:500}
.apr .at .i{width:18px;height:18px}
.miss{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.miss span{display:flex;align-items:center;gap:6px}
.miss .ok{color:#86efac}
.hist{display:flex;flex-direction:column;gap:0;position:relative;padding-left:16px}
.hist::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:#2f2f36}
.he{position:relative;padding:5px 0;font-size:12px;color:var(--text-2)}
.he::before{content:"";position:absolute;left:-15px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--c,#5a5a63)}
.he .sub{font-size:11px}
.he q{display:block;color:var(--muted);font-style:italic;margin-top:2px}
/* métricas */
.met{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.met label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}
/* produto */
.ben{display:flex;flex-direction:column;gap:6px}
.ben-r{display:flex;align-items:center;gap:8px}
.ben-r .n{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:11.5px;color:var(--text-2);flex:none}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:8px;border:2px solid transparent;transition:transform .2s var(--ease)}
.sw button:hover{transform:scale(1.1)}
.sw button.on{border-color:#fff}
.more{margin-top:4px}
.more summary{cursor:pointer;list-style:none;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{margin-bottom:12px}

/* confirmação */
.ask{width:min(380px,100%);padding:20px;animation:pop .3s var(--ease) both}
.ask h3{font-size:15px;font-weight:600;margin-bottom:6px}
.ask p{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.ask .row{justify-content:flex-end}

/* toasts */
.toasts{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 16px;border-radius:12px;background:#222226;border:1px solid var(--line-2);display:flex;gap:9px;align-items:center;box-shadow:0 20px 40px -10px rgba(0,0,0,.7);animation:pop .3s var(--ease) both;max-width:calc(100vw - 32px)}
.toast .dot{background:var(--text-2)}.toast.g .dot{background:var(--green)}.toast.r .dot{background:var(--red)}.toast.y .dot{background:var(--yellow)}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* bloqueio / login */
body.locked #app{filter:blur(18px) saturate(.7);pointer-events:none;user-select:none}
body.locked{overflow:hidden}
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(8,8,10,.35);animation:fade .35s both}
.gate-in{width:min(220px,80vw);height:54px;border-radius:16px;background:rgba(25,25,28,.85);border:1px solid var(--line-2);color:var(--text);text-align:center;font-size:22px;letter-spacing:.5em;padding-left:.5em;outline:none;box-shadow:0 30px 60px -20px rgba(0,0,0,.9);-webkit-text-security:disc;animation:pop .45s var(--ease) both}
.gate-in.shake{animation:shake .4s}
.boot{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);font-size:12px}
body.ready .boot{display:none}

@media (max-width:820px){
  .top{grid-template-columns:1fr auto;padding-left:16px;padding-right:16px}
  .top-c{display:none}
  .tb button .tl{display:none}
  .tb button{padding:0 9px}
  .page{padding-left:16px;padding-right:16px}
  .wkv{padding-left:16px;padding-right:16px}
  .fio{flex-direction:column;align-items:stretch;width:min(420px,100%)}
  .slot{width:100%;flex-direction:row;align-items:center;gap:14px}
  .lab{position:static;transform:none;width:auto;align-items:flex-start;text-align:left;flex:1;pointer-events:none}
  .lab .lm{justify-content:flex-start}
  .wire{height:46px;padding:6px 0;width:72px;justify-content:center;flex:none}
  .wire i{width:1.5px;height:100%}
  .wire i::after{transform:scaleY(0);transform-origin:top}
  .wire.done i::after{transform:scaleY(1)}
  .kpis{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .met{grid-template-columns:repeat(2,1fr)}
  .lnk{grid-template-columns:1fr auto auto}
  .lnk .inp:first-child{grid-column:1/-1}
  .base .bp ol{grid-template-columns:1fr}
  .scrim{padding:0;place-items:end stretch}
  .md,.md.narrow{width:100%;max-height:94vh;max-height:94dvh;border-radius:20px 20px 0 0}
  .tbl .hm{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* =================== dados =================== */
const store = { docs: {}, queue: {}, since: 0, role: null, name: '', board: 'br', ready: false, saving: false, switching: false };
const D = k => store.docs[k];
const isAdmin = () => store.role === 'admin';
async function api(path, opt = {}) {
  const headers = { 'x-board': store.board, ...(opt.headers || {}) };
  if (typeof opt.body === 'string' && !headers['content-type']) headers['content-type'] = 'application/json';
  try {
    const r = await fetch(path, { credentials: 'same-origin', ...opt, headers });
    let data = {}; try { data = await r.json(); } catch (e) {}
    return { ok: r.ok, status: r.status, data };
  } catch (e) { return { ok: false, status: 0, data: {} }; }
}
function commit(path, body, now = true) {
  if (body === null) delete store.docs[path]; else store.docs[path] = body;
  store.queue[path] = body; savest('Salvando…');
  clearTimeout(commit.t); commit.t = setTimeout(flush, now ? 450 : 1200);
}
async function flush() {
  if (store.saving) return; const keys = Object.keys(store.queue); if (!keys.length) return;
  const ops = keys.map(path => ({ path, body: store.queue[path] })); store.queue = {}; store.saving = true;
  const r = await api('/api/docs', { method: 'POST', body: JSON.stringify({ ops }) });
  store.saving = false;
  if (!r.ok) {
    if (r.status === 403) { toast('Sem permissão para isso — só um admin pode', 'r'); savest('Sem permissão'); const d = await api('/api/docs'); if (d.ok) { store.docs = d.data.docs || {}; render(); if (ED.kind) paintModal(); } return; }
    ops.forEach(o => { if (!(o.path in store.queue)) store.queue[o.path] = o.body; }); savest('Erro ao salvar'); setTimeout(flush, 4000); return;
  }
  if (r.data.now) store.since = Math.max(store.since, r.data.now - 1);
  savest('Salvo'); if (Object.keys(store.queue).length) flush();
}
function savest(t) { const el = $('#savest'); if (el) el.innerHTML = t ? `<span class="dot ${/Salvo/.test(t) ? 'g' : /Erro|Sem/.test(t) ? 'r' : 'o'}"></span>${t}` : ''; }
const busyTyping = () => /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
async function poll() {
  if (store.switching || !store.ready || document.hidden) return;
  const r = await api('/api/changes?since=' + store.since); if (!r.ok) return;
  let ch = false;
  for (const [k, v] of Object.entries(r.data.docs || {})) { if (k in store.queue) continue; if (v === null) delete store.docs[k]; else store.docs[k] = v; ch = true; }
  store.since = r.data.now;
  if (!ch) return;
  if (ED.kind && !D((ED.kind === 'item' ? 'item/' : 'prod/') + ED.id)) closeModal();
  if (busyTyping()) return;
  render(); if (ED.kind) paintModal();
}
const docsOf = pre => Object.entries(store.docs).filter(([k, v]) => k.startsWith(pre) && v).map(([k, v]) => ({ ...v, id: k.slice(pre.length) }));
const items = () => docsOf('item/');
const prods = () => docsOf('prod/').sort((a, b) => (a.t || 0) - (b.t || 0));
const prod = id => D('prod/' + id) ? { ...D('prod/' + id), id } : null;
const IT = id => D('item/' + id) ? clone({ ...D('item/' + id), id }) : null;
function putItem(it) { const { id, ...b } = it; b.u = Date.now(); commit('item/' + id, b); }
function putProd(p) { const { id, ...b } = p; b.u = Date.now(); commit('prod/' + id, b); }
const CFG0 = () => ({ start: monday(todayISO()), days: [0, 2, 4], leadRot: 3, leadApr: 2, logoSize: 30 });
const cfg = () => ({ ...CFG0(), ...(D('app/cfg') || {}) });
const cfgSet = (k, v) => commit('app/cfg', { ...(D('app/cfg') || CFG0()), [k]: v });
const weekNo = wk => Math.floor(diffD(cfg().start, wk) / 7) + 1;
const wkLabel = wk => { const n = weekNo(wk); return n >= 1 ? 'semana ' + pad(n) : 'pré-estreia'; };
const weekItems = wk => { const a = [null, null, null]; items().filter(i => i.wk === wk && i.slot >= 0 && i.slot < 3).sort((x, y) => (x.t || 0) - (y.t || 0)).forEach(i => { if (!a[i.slot]) a[i.slot] = i; }); return a; };
const banco = () => items().filter(i => !i.wk).sort((a, b) => (b.t || 0) - (a.t || 0));
function lateOf(it) {
  const t = todayISO(), s = SI(it.stage);
  if (s >= SI('feito')) return '';
  if (s < SI('publicado') && it.date && it.date < t) return 'publicação atrasada';
  if (s < SI('aprovacao') && it.dRot && it.dRot < t) return 'roteiro atrasado';
  if (s === SI('aprovacao') && it.dApr && it.dApr < t) return 'aprovação atrasada';
  return '';
}
const pendCount = () => items().filter(i => i.stage === 'aprovacao').length;

function rememberBoard(b) { try { localStorage.setItem('nv:board', b); } catch (e) {} document.cookie = 'nv_b=' + b + '; Path=/; Secure; SameSite=Lax; Max-Age=31536000'; const u = new URL(location.href); u.searchParams.set('pais', b); u.searchParams.delete('c'); history.replaceState(null, '', u); }
async function setBoard(b) {
  if (b === store.board || store.switching) return; store.switching = true;
  try {
    clearTimeout(commit.t); await flush();
    for (let i = 0; i < 40 && (store.saving || Object.keys(store.queue).length); i++) { await new Promise(r => setTimeout(r, 150)); if (!store.saving) await flush(); }
    if (Object.keys(store.queue).length) { toast('Ainda salvando. Tente de novo em instantes.', 'r'); return; }
    const s = await api('/api/session', { headers: { 'x-board': b } });
    if (!s.data.role) { toast('Você não tem acesso ao nossavet ' + PAIS[b] + '. Peça a liberação no Quintal.', 'r'); return; }
    const d = await api('/api/docs', { headers: { 'x-board': b } }); if (!d.ok) { toast('Não foi possível abrir ' + PAIS[b] + '.', 'r'); return; }
    closeModal();
    store.board = b; store.role = s.data.role; store.name = s.data.name || '';
    store.docs = d.data.docs || {}; store.since = d.data.now || 0; store.queue = {};
    if (UI.view === 'set' && !isAdmin()) UI.view = 'semana';
    rememberBoard(b); seed(); render();
  } finally { store.switching = false; }
}
function seed() { if (isAdmin() && !D('app/cfg')) commit('app/cfg', CFG0(), false); }

/* =================== ações do conteúdo =================== */
function hist(it, a, extra = {}) { it.hist = [...(it.hist || []), { t: Date.now(), by: store.name, a, ...extra }].slice(-80); }
function sendApproval(it) {
  const m = missing(it);
  if (!m.ok) { UI.tab = 'apr'; saveUI(); paintModal(); toast('Falta: ' + m.all.filter(x => !x[0]).map(x => x[1].toLowerCase()).join(', '), 'r'); return; }
  it.stage = 'aprovacao'; it.aj = false; it.apr = null; it.rq = { id: uid(), t: Date.now(), by: store.name, status: 'pending' }; hist(it, 'enviou');
  putItem(it); toast('Enviado para aprovação', 'g');
}
function decide(it, accept) {
  const note = ($('#apr-note')?.value || '').trim();
  if (!accept && !note) { toast('Escreva o que precisa ajustar', 'r'); $('#apr-note')?.focus(); return; }
  if (!it.rq || it.rq.status !== 'pending') it.rq = { id: uid(), t: Date.now(), by: store.name, status: 'pending' };
  const t = Date.now();
  it.rq = { ...it.rq, status: accept ? 'ok' : 'no', decidedAt: t, note, dby: store.name };
  hist(it, accept ? 'aprovou' : 'ajuste', note ? { note } : {});
  if (accept) { it.stage = 'aprovado'; it.apr = { by: store.name, t }; it.aj = false; } else { it.stage = 'roteiro'; it.apr = null; it.aj = true; }
  putItem(it); toast(accept ? 'Aprovado' : 'Ajuste pedido', accept ? 'g' : 'y');
}
function nextStage(it) {
  const s = it.stage || 'tema';
  if (s === 'tema') { if (!String(it.title || '').trim()) { toast('Dê um nome ao tema primeiro', 'r'); $('.md-t')?.focus(); return; } it.stage = 'roteiro'; hist(it, 'roteiro'); UI.tab = 'roteiro'; }
  else if (s === 'aprovado') { it.stage = 'producao'; hist(it, 'producao'); }
  else if (s === 'producao') { if (!Object.values(it.pub || {}).some(Boolean)) { UI.tab = 'pub'; saveUI(); paintModal(); toast('Cole o link de pelo menos um post', 'r'); return; } it.stage = 'publicado'; it.pubAt = Date.now(); hist(it, 'publicou'); UI.tab = 'pub'; }
  else if (s === 'publicado') { it.stage = 'feito'; it.doneAt = Date.now(); hist(it, 'feito'); }
  saveUI(); putItem(it);
  if (it.stage === 'feito') toast('Conteúdo feito!', 'g');
}
function setStage(it, k) {
  if (!isAdmin() || it.stage === k) return;
  const n = SI(k);
  if (n >= SI('aprovado') && !it.apr) { it.apr = { by: store.name, t: Date.now() }; if (it.rq?.status === 'pending') it.rq = { ...it.rq, status: 'ok', decidedAt: Date.now(), dby: store.name }; }
  if (n < SI('aprovado')) it.apr = null;
  if (n === SI('aprovacao') && (!it.rq || it.rq.status !== 'pending')) it.rq = { id: uid(), t: Date.now(), by: store.name, status: 'pending' };
  if (n < SI('aprovacao') && it.rq?.status === 'pending') it.rq = { ...it.rq, status: 'no', decidedAt: Date.now(), dby: store.name, note: 'etapa alterada' };
  if (n === SI('feito') && !it.doneAt) it.doneAt = Date.now();
  it.aj = false; it.stage = k; hist(it, 'etapa', { to: k }); putItem(it);
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (!e.target.closest('#hov')) hideHov(); return; }
  const a = t.dataset.act, v = t.dataset.v;
  const it = ED.kind === 'item' ? IT(ED.id) : null, p = ED.kind === 'prod' ? prod(ED.id) : null;
  switch (a) {
    case 'view': { const o = VIEWS.findIndex(x => x[0] === UI.view), n = VIEWS.findIndex(x => x[0] === v); dir = n < o && n >= 0 ? 'from-l' : ''; UI.view = v; saveUI(); if (ED.kind) closeModal(); render(); scrollTo(0, 0); if (v === 'set') loadBackups(); return; }
    case 'board': return setBoard(v);
    case 'wk': dir = +v < 0 ? 'from-l' : ''; UI.wk = addD(UI.wk, +v * 7); saveUI(); return render();
    case 'wk0': { const c = monday(todayISO()); if (UI.wk === c) return; dir = c < UI.wk ? 'from-l' : ''; UI.wk = c; saveUI(); return render(); }
    case 'slot': if (!weekItems(UI.wk)[+t.dataset.slot]) showHov(+t.dataset.slot, t); return;
    case 'place': return place(+t.dataset.slot, v);
    case 'open': return openEd('item', t.dataset.id);
    case 'openprod': return openEd('prod', t.dataset.id);
    case 'close': return closeModal();

    g.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><input class="gate-in" id="gate-pin" type="text" inputmode="numeric" autocomplete="off" aria-label="Senha de emergência"><div style="font-size:11.5px;color:#85858e">${down ? 'Quintal fora do ar · senha de emergência' : 'Senha de emergência'}</div></div>`;

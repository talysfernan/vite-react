<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<title>CAO(S) · Lousa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0b0b0d; --node:#19191c; --node-2:#1f1f23; --well:#141416; --line:#2a2a30; --line-2:#36363d;
  --text:#ededf0; --text-2:#b6b6be; --muted:#85858e; --dim:#5a5a63;
  --green:#4ade80; --yellow:#facc15; --red:#f87171; --blue:#60a5fa;
  --radius:18px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Inter","SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --glass:rgba(25,25,28,.72); --gline:rgba(255,255,255,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
#cv{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
body.locked #cv,body.locked .ui{visibility:hidden}

/* logo pequeno ao lado da engrenagem */
.brandc{position:fixed;right:72px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:44px;display:flex;align-items:center;z-index:11;pointer-events:none}
.brandc img{height:17px;width:auto;display:block;opacity:.9}
body.nogear .brandc{right:18px}
@media (max-width:760px){.brandc{right:58px;bottom:calc(84px + env(safe-area-inset-bottom,0px));height:38px}.brandc img{height:14px}body.nogear .brandc{right:12px}}
/* barras em vidro */
.bar{position:fixed;display:flex;align-items:center;gap:2px;padding:5px;border-radius:16px;background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 24px 48px -28px rgba(0,0,0,.85);z-index:10}
.tools{left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}
.sep{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 5px;flex:none}
.tb{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:transform .25s var(--ease),background .2s,color .2s;flex:none;position:relative}
.tb svg{transition:transform .25s var(--ease)}
.tb:hover{transform:translateY(-3px);color:var(--text)}
.tb:hover svg{transform:scale(1.1)}
.tb.on{background:rgba(255,255,255,.12);color:var(--text);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset}
.tb:disabled{opacity:.3;pointer-events:none}
.sw{width:30px;height:34px;display:grid;place-items:center;flex:none;transition:transform .25s var(--ease)}
.sw i{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset;transition:transform .25s var(--ease),box-shadow .2s}
.sw:hover{transform:translateY(-3px)}
.sw.on i{transform:scale(1.15);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--c)}
.sz{width:30px;height:34px;display:grid;place-items:center;flex:none;border-radius:10px;transition:transform .25s var(--ease),background .2s}
.sz i{border-radius:50%;background:var(--muted);transition:background .2s}
.sz:hover{transform:translateY(-3px)}.sz:hover i,.sz.on i{background:var(--text)}
.sz.on{background:rgba(255,255,255,.1)}
.stylebtn{display:none}
.stylepop{display:contents}
@media (max-width:760px){
  .stylebtn{display:grid}
  .stylepop{display:none;position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);flex-wrap:nowrap;justify-content:center;max-width:calc(100vw - 24px)}
  .stylepop .sw,.stylepop .sz{width:28px}
  .stylepop.open{display:flex}
  .tools .sep.wide{display:none}
}
.zoom{left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:4px}
.zoom .tb{width:30px;height:30px}
.zoom .zv{min-width:48px;height:30px;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;transition:background .2s}
.zoom .zv:hover{background:rgba(255,255,255,.08)}
@media (max-width:760px){.zoom{display:none}}
.selbar{left:50%;top:0;transform:translate(-50%,-100%);padding:4px;display:none}
.selbar.show{display:flex}
.selbar .tb{width:30px;height:30px}
.selbar .tb.dg:hover{color:var(--red)}

/* engrenagem isolada no canto */
.gearfab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:12;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:var(--muted);background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:color .3s,transform .5s var(--ease)}
.gearfab:hover,.gearfab.on{color:var(--text);transform:rotate(60deg)}
.gearfab svg{width:19px;height:19px}
body.nogear .gearfab{display:none}
@media (max-width:760px){.gearfab{right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:38px;height:38px;border-radius:13px}}
/* console de ajustes (mesmo padrão do Quintal) */
.console{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:rgba(5,5,7,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fade .25s both}
.console.out{animation:fadeOut .3s var(--ease) forwards}
@keyframes fadeOut{to{opacity:0}}
.cbox{width:min(860px,100%);height:min(560px,calc(100dvh - 36px));display:grid;grid-template-columns:220px minmax(0,1fr);border-radius:24px;overflow:hidden;background:#111113;border:1px solid var(--line);box-shadow:0 60px 120px -40px rgba(0,0,0,.95);animation:pop .4s var(--ease) both}
.cside{display:flex;flex-direction:column;gap:4px;padding:18px 14px;background:#0d0d0f;border-right:1px solid var(--line)}
.cside .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.cside .brand .av{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#ededf0,#85858e);color:#111;display:grid;place-items:center;flex:none}
.cside .brand b{display:block;font-size:13.5px}.cside .brand small{color:var(--dim);font-size:11px}
.navb{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:11px;color:var(--text-2);font-size:13px;text-align:left;transition:background .2s,color .2s}
.navb:hover{background:#18181b;color:var(--text)}.navb.on{background:#1f1f23;color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
.navb em{margin-left:auto;font-style:normal;font-size:11px;color:var(--dim)}
.cside .sp{flex:1}
.cmain{display:flex;flex-direction:column;min-width:0}
.chead{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
.chead h2{font-size:17px;font-weight:650;margin:0}.chead .sub{color:var(--dim);font-size:12px}
.chead .sp{flex:1}
.cbody{flex:1;overflow:auto;padding:22px 24px 40px}
.sect{margin-bottom:22px}.sect>h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 2px 10px}
.box{padding:16px;border-radius:16px;background:#17171a;border:1px solid var(--line);margin-bottom:10px}
.box .row{display:flex;gap:8px;align-items:center}
.hint{color:var(--dim);font-size:12px;line-height:1.45}
.box .hint{margin:0 0 12px}
.pill{height:34px;padding:0 14px;border-radius:11px;background:var(--node);border:1px solid var(--line);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .2s,color .2s,border-color .2s;white-space:nowrap}
.pill:hover{color:var(--text);border-color:var(--line-2)}
.pill.white{background:#f4f4f5;color:#111;border-color:#f4f4f5}
.pill.dg{background:#3a1717;border-color:#5a2222;color:#fecaca}
.pill.sm{height:30px;padding:0 11px;border-radius:10px;font-size:12px}
.pill.icon{width:30px;padding:0}
.inp{height:34px;border-radius:10px;background:var(--well);border:1px solid var(--line);padding:0 12px;color:var(--text);font:inherit;outline:none;flex:1;min-width:0}
.inp:focus{border-color:var(--line-2)}
.inp.pw{-webkit-text-security:disc}
.bklist{display:flex;flex-direction:column}
.bk{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px;align-items:center;color:var(--text-2)}
.bk:last-child{border-bottom:0}
.bk span{color:var(--muted)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#222226;color:var(--muted)}
@media (max-width:760px){
  .console{padding:10px}
  .cbox{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:calc(100dvh - 20px)}
  .cside{flex-direction:row;align-items:center;gap:4px;padding:10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .cside .brand,.cside .sp{display:none}
  .navb{flex:none}
  .chead{padding:14px 16px}.cbody{padding:16px 16px 30px}
  .bk{grid-template-columns:90px minmax(0,1fr) auto}
}

/* texto na lousa */
#ted{position:fixed;z-index:8;margin:0;padding:0;border:0;outline:none;background:transparent;resize:none;overflow:hidden;white-space:pre;font-family:var(--font);line-height:1.25;caret-color:currentColor;-webkit-user-select:text;user-select:text;min-width:2ch}

/* janela de confirmação */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;animation:fade .2s var(--ease)}
.ask{width:min(340px,calc(100vw - 32px));padding:18px;border-radius:var(--radius);background:linear-gradient(180deg,#1c1c20,#17171a);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 24px 48px -28px rgba(0,0,0,.85);animation:pop .3s var(--ease)}
.ask h3{margin:0 0 16px;font-size:14px;font-weight:600;line-height:1.4}
.ask .row{display:flex;gap:8px;justify-content:flex-end}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:60;padding:9px 15px;border-radius:12px;background:rgba(25,25,28,.92);border:1px solid var(--line);color:var(--text-2);font-size:12.5px;opacity:0;transition:opacity .25s var(--ease),transform .3s var(--ease);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.r{color:#fecaca;border-color:#5a2222}
#gate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--bg)}
.gate-in{width:200px;height:44px;border-radius:13px;background:var(--well);border:1px solid var(--line);color:var(--text);text-align:center;font-size:18px;letter-spacing:.3em;outline:none;-webkit-text-security:disc}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
'use strict';
/* =================== estado =================== */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const COLORS = ['#ededf0', '#facc15', '#4ade80', '#60a5fa', '#f472b6', '#f87171'];
const SIZES = [2, 4, 8, 16];
const LS = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem('lousa:' + k)); localStorage.setItem('lousa:' + k, JSON.stringify(v)); } catch (e) { return null; } };
const st = Object.assign({ tool: 'pen', color: COLORS[0], size: 4 }, LS('pref') || {});
if (!COLORS.includes(st.color)) st.color = COLORS[0];
if (!SIZES.includes(st.size)) st.size = 4;
const cam = Object.assign({ x: 0, y: 0, z: 1 }, LS('cam') || {});
let role = null, docs = {}, since = 0, ready = false;
const cache = new Map();           // path -> {body, bb, p2d}
const pending = new Map();         // path -> body|null (a enviar)
let undoS = [], redoS = [];
let sel = new Set();               // paths selecionados
let dirty = true, dpr = 1, W = 0, H = 0;
const ERASE_R = 10;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let toastT;
function toast(m, cls = '') { const t = $('toast'); t.textContent = m; t.className = 'toast show ' + cls; clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast ' + cls, 2600); }
const isAdmin = () => role === 'admin';

/* =================== servidor =================== */
async function api(path, opt = {}) {
  const r = await fetch(path, { credentials: 'same-origin', ...opt, headers: { 'content-type': 'application/json', ...(opt.headers || {}) } });
  let data = {}; try { data = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, data };
}
let flushT = 0, flushing = false;
function commit(path, body) {
  if (body === null) delete docs[path]; else docs[path] = body;
  pending.set(path, body);
  dirty = true;
  clearTimeout(flushT); flushT = setTimeout(flush, 350);
}
let netWas = true;
function netOk(ok) { if (ok !== netWas) toast(ok ? 'Conexão de volta · tudo salvo' : 'Sem conexão · salvo aqui, envia quando voltar', ok ? '' : 'r'); netWas = ok; }
async function flush() {
  if (flushing || !pending.size) return;
  flushing = true;
  const batch = [...pending.entries()].slice(0, 300);
  try {
    const r = await api('/api/docs', { method: 'POST', body: JSON.stringify({ ops: batch.map(([path, body]) => ({ path, body })) }) });
    if (r.status === 401) { lockScreen(); return; }
    if (!r.ok) throw new Error(r.data.error || r.status);
    for (const [p, b] of batch) if (pending.get(p) === b) pending.delete(p);
    netOk(true);
  } catch (e) {
    netOk(false);
    clearTimeout(flushT); flushT = setTimeout(flush, 4000);
  } finally { flushing = false; }
  if (pending.size) { clearTimeout(flushT); flushT = setTimeout(flush, 150); }
}
async function poll() {
  if (!ready || document.hidden) return;
  try {
    const r = await api('/api/changes?since=' + since);
    if (r.status === 401) return lockScreen();
    if (!r.ok) throw 0;
    since = r.data.now || since;
    for (const [p, b] of Object.entries(r.data.docs || {})) {
      if (pending.has(p) || (draw && draw.path === p) || (edit && edit.path === p)) continue;
      if (b === null) { delete docs[p]; sel.delete(p); } else docs[p] = b;
      dirty = true;
    }
    if (!pending.size) netOk(true);
  } catch (e) { netOk(false); }
}
window.pendingCount = () => pending.size + (draw || drag ? 1 : 0);
window.addEventListener('beforeunload', e => { if (pending.size) { flush(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else poll(); });

/* histórico: cada ação = [[path, antes, depois], ...] */
function act(list) {
  list = list.filter(([, a, b]) => a !== b);
  if (!list.length) return;
  for (const [p, , b] of list) commit(p, b);
  undoS.push(list); if (undoS.length > 200) undoS.shift();
  redoS = []; syncHist();
}
function undo() { const a = undoS.pop(); if (!a) return; for (const [p, b] of a) commit(p, b ?? null); redoS.push(a); sel.clear(); syncHist(); }
function redo() { const a = redoS.pop(); if (!a) return; for (const [p, , b] of a) commit(p, b ?? null); undoS.push(a); sel.clear(); syncHist(); }
function syncHist() { $('undo').disabled = !undoS.length; $('redo').disabled = !redoS.length; dirty = true; }

/* =================== entrada (caneta, mouse, toque) =================== */

  ta.value = b.txt; ta.style.color = b.c;
  document.body.appendChild(ta); placeEditor(); dirty = true;
  ta.addEventListener('input', placeEditor);
  ta.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Escape' || (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey))) { ev.preventDefault(); finishEdit(); } });
  ta.addEventListener('blur', () => setTimeout(() => { if (edit && edit.ta === ta) finishEdit(); }, 0));
  const foc = () => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); };
  foc(); setTimeout(foc, 0);
}
function placeEditor() {
  const { ta, body: b } = edit, fs = b.s * cam.z;
  ta.style.font = textFont(fs); ta.style.lineHeight = LH;
  ta.style.left = (b.x - cam.x) * cam.z + 'px'; ta.style.top = (b.y - cam.y) * cam.z + 'px';
  ta.style.width = '0px'; ta.style.height = '0px';
  ta.style.width = (ta.scrollWidth + fs * .5) + 'px'; ta.style.height = ta.scrollHeight + 'px';
}
function finishEdit() {
  const e = edit; if (!e) return; edit = null;
  const txt = e.ta.value.replace(/\s+$/, ''); e.ta.remove();
  if (e.isNew) { if (txt) act([[e.path, undefined, { ...e.body, txt }]]); }
  else if (!txt) act([[e.path, docs[e.path], null]]);
  else if (txt !== e.body.txt) act([[e.path, docs[e.path], { ...docs[e.path], txt }]]);
  dirty = true;
}

/* =================== barra =================== */
function setTool(t) {

}
function buildStyle() {

  $('sizes').innerHTML = SIZES.map(s => `<button class="sz ${s === st.size ? 'on' : ''}" data-size="${s}" title="Espessura ${s}"><i style="width:${Math.min(14, s + 2)}px;height:${Math.min(14, s + 2)}px"></i></button>`).join('');

}
$('tools').addEventListener('click', e => {

  else if (b.dataset.color) { st.color = b.dataset.color; restyleSel({ c: st.color }); if (st.tool !== 'select') setTool(st.tool === 'text' ? 'text' : 'pen'); buildStyle(); LS('pref', st); updCursor(); }
  else if (b.dataset.size) { st.size = +b.dataset.size; if (st.tool !== 'text' && st.tool !== 'select') setTool('pen'); buildStyle(); LS('pref', st); updCursor(); }

});
function restyleSel(patch) { if (st.tool === 'select' && sel.size) act([...sel].filter(p => docs[p]).map(p => [p, docs[p], { ...docs[p], ...patch }])); }
function closePops() { $('stylepop').classList.remove('open'); }
$('zin').onclick = () => zoomBy(1.25);
$('zout').onclick = () => zoomBy(1 / 1.25);
$('zval').onclick = () => { const c = toW(W / 2, H / 2); animTo(c.x - W / 2, c.y - H / 2, 1); };
$('zfit').onclick = fitAll;
$('seldel').onclick = delSel;
async function delSel() {
  const list = [...sel].filter(p => docs[p]); if (!list.length) return;
  if (!(await ask(list.length === 1 ? 'Excluir o item selecionado?' : `Excluir os ${list.length} itens selecionados?`))) return;
  act(list.map(p => [p, docs[p], null])); sel.clear(); hoverSel = false; updCursor();
}

document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName || '') || document.querySelector('.scrim, #console')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'a' && st.tool === 'select') { e.preventDefault(); sel = new Set(items()); dirty = true; return; }
  if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomBy(1.25); return; }
  if (mod && k === '-') { e.preventDefault(); zoomBy(1 / 1.25); return; }
  if (mod && k === '0') { e.preventDefault(); $('zval').onclick(); return; }
  if (mod) return;
  if (k === ' ' && !spaceDown) { e.preventDefault(); spaceDown = true; updCursor(); return; }
  if ((k === 'delete' || k === 'backspace') && sel.size) { e.preventDefault(); delSel(); return; }
  if (k === 'escape') { sel.clear(); closePops(); dirty = true; return; }
  const map = { v: 'select', h: 'hand', p: 'pen', b: 'pen', e: 'eraser', t: 'text' };
  if (map[k]) setTool(map[k]);
  if (k === '1' && e.shiftKey) fitAll();
});
document.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; updCursor(); } });
window.addEventListener('blur', () => { spaceDown = false; updCursor(); });

/* janela Cancelar/Excluir */
function ask(title, ok = 'Excluir') {
  return new Promise(res => {
    const s = document.createElement('div'); s.className = 'scrim';
    s.innerHTML = `<div class="ask"><h3>${esc(title)}</h3><div class="row"><button class="pill" data-a="0">Cancelar</button><button class="pill dg" data-a="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(s);
    const done = v => { s.remove(); document.removeEventListener('keydown', kd, true); res(v); };
    const kd = ev => { if (ev.key === 'Escape') { ev.stopPropagation(); done(false); } if (ev.key === 'Enter') { ev.stopPropagation(); done(true); } };
    document.addEventListener('keydown', kd, true);
    s.addEventListener('pointerdown', ev => { if (ev.target === s) done(false); });
    s.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => done(b.dataset.a === '1')));
  });
}

/* =================== ajustes (console, padrão do Quintal) =================== */
const IC = {
  db: '<ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/>',
  shield: '<path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6L12 3z"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  out: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/>',
  dl: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  pen: '<path d="M15.5 4.5l4 4L8 20H4v-4L15.5 4.5z"/>'
};
const ic = k => `<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`;
const SECS = [['data', 'Dados', 'db', 'Fotos diárias da lousa (30 dias)'], ['sec', 'Segurança', 'shield', 'Senha de emergência deste painel']];
let sec = 'data', BK = null;
$('gear').onclick = e => { e.stopPropagation(); if (document.getElementById('console')) closeConsole(); else openConsole(); };
function openConsole() {
  if (!isAdmin()) return;
  closePops(); if (edit) finishEdit();
  BK = null;
  const d = document.createElement('div'); d.className = 'console'; d.id = 'console';
  d.innerHTML = `<div class="cbox" role="dialog" aria-label="Ajustes"><aside class="cside"></aside><section class="cmain"><header class="chead"></header><div class="cbody"></div></section></div>`;
  document.body.appendChild(d); $('gear').classList.add('on');
  d.addEventListener('pointerdown', e => { if (e.target === d) closeConsole(); });
  d.addEventListener('click', onConsole);
  paint();
}
function closeConsole() {
  const d = document.getElementById('console'); if (!d) return;
  d.id = ''; d.classList.add('out'); $('gear').classList.remove('on'); setTimeout(() => d.remove(), 300);
}
function paint() {
  const d = document.getElementById('console'); if (!d) return;
  const s = SECS.find(x => x[0] === sec), body = d.querySelector('.cbody'), y = body.scrollTop;
  d.querySelector('.cside').innerHTML = `<div class="brand"><span class="av">${ic('pen')}</span><div><b>Ajustes</b><small>Lousa · admin</small></div></div>
    ${SECS.map(([k, l, i]) => `<button class="navb ${sec === k ? 'on' : ''}" data-act="sec" data-v="${k}">${ic(i)}${l}${k === 'data' && BK ? `<em>${BK.length}</em>` : ''}</button>`).join('')}
    <span class="sp"></span><button class="navb" data-act="out">${ic('out')}Sair</button>`;
  d.querySelector('.chead').innerHTML = `<div><h2>${s[1]}</h2><div class="sub">${s[3]}</div></div><span class="sp"></span><button class="pill sm icon" data-act="close" aria-label="Fechar">${ic('x')}</button>`;
  body.innerHTML = sec === 'data' ? secData() : secSec();
  body.scrollTop = y;
  if (sec === 'data' && !BK) api('/api/backups').then(r => { BK = r.data.backups || []; paint(); });
}
function secData() {
  const list = BK ? BK.map(b => `<div class="bk"><b>${b.day.split('-').reverse().join('/')}</b><span>${b.n} ${b.n === 1 ? 'item' : 'itens'}</span><a class="pill sm" href="/api/backups/${b.day}" download="lousa-${b.day}.json">${ic('dl')}Baixar</a></div>`).join('') || '<p class="hint" style="margin:0">Ainda sem fotos.</p>' : '<p class="hint" style="margin:0">Carregando…</p>';
  return `<div class="sect"><h4>Fotos diárias</h4><div class="box"><p class="hint">A lousa tira uma foto sozinha todo dia às 22:50 e guarda 30 dias.</p><div class="bklist">${list}</div></div>
    <button class="pill sm" data-act="bknow">Tirar foto agora</button></div>`;
}
function secSec() {
  return `<div class="sect"><h4>Senha de emergência</h4><div class="box"><p class="hint">Só para quando o Quintal estiver fora do ar. Abra a lousa com <b>?emergencia</b> no endereço.</p>
    <div class="row"><input class="inp pw" id="pin" type="text" autocomplete="off" spellcheck="false" placeholder="Nova senha"><button class="pill sm white" data-act="pin">Salvar</button></div></div></div>`;
}
async function onConsole(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'close') closeConsole();
  else if (a === 'sec') { sec = b.dataset.v; paint(); }
  else if (a === 'out') { await flush(); await api('/api/logout', { method: 'POST' }); location.replace('https://meucaos.com/'); }
  else if (a === 'bknow') { await flush(); const x = await api('/api/backups/now', { method: 'POST' }); toast(x.ok ? 'Foto salva' : 'Não deu para salvar', x.ok ? '' : 'r'); BK = null; paint(); }
  else if (a === 'pin') {
    const i = $('pin'), v = i.value.trim(); if (v.length < 4) return toast('Mínimo de 4 caracteres', 'r');
    const r = await api('/api/pin', { method: 'POST', body: JSON.stringify({ pin: v }) });
    toast(r.ok ? 'Senha de emergência trocada' : 'Não deu para salvar', r.ok ? '' : 'r'); if (r.ok) i.value = '';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('console')) { e.stopPropagation(); closeConsole(); } }, true);

/* =================== início =================== */
window.addEventListener('resize', resize);
resize(); buildStyle(); setTool(st.tool); syncHist();
if (!LS('cam')) { cam.x = -W / 2; cam.y = -H / 2; }
requestAnimationFrame(frame);
(async () => {
  const s = await api('/api/session').catch(() => ({ data: { down: true } }));
  if (!s.data.role) return lockScreen();
  role = s.data.role;
  document.body.classList.toggle('nogear', !isAdmin());
  const d = await api('/api/docs');
  if (!d.ok) return lockScreen();
  docs = d.data.docs || {}; since = d.data.now || 0; ready = true; dirty = true;
  document.body.classList.remove('locked');
  setInterval(poll, 4000);
})();
</script>
<script>
/* login único pelo Quintal do CAO(S) */
(function () {
  const QUINTAL = 'https://meucaos.com/';
  const emerg = /[?&]emergencia\b/.test(location.search);
  const toQuintal = () => location.replace(QUINTAL + '?next=' + encodeURIComponent(location.origin + location.pathname));
  function emergencyGate(down) {
    document.getElementById('gate')?.remove();
    const g = document.createElement('div'); g.id = 'gate';
    g.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><input class="gate-in" id="gate-pin" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Senha de emergência"><div style="font-size:11.5px;color:#85858e">${down ? 'Quintal fora do ar · senha de emergência' : 'Senha de emergência'}</div></div>`;
    document.body.appendChild(g);
    const inp = document.getElementById('gate-pin'); setTimeout(() => inp.focus(), 60);
    let busy = 0;
    const tryPin = async v => {
      const r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: 'admin', pin: v }) }).catch(() => null);
      return !!(r && r.ok);
    };
    inp.addEventListener('input', async () => { const v = inp.value.trim(), n = ++busy; if (v.length < 4) return; if (await tryPin(v) && n === busy) { inp.disabled = true; location.replace(location.pathname); } });
    inp.addEventListener('keydown', async e => { if (e.key === 'Enter' && !(await tryPin(inp.value.trim()))) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.select(); } });
  }
  window.lockScreen = function () {
    document.body.classList.add('locked');
    if (emerg) return emergencyGate(false);
    fetch('/api/session', { credentials: 'same-origin' }).then(r => r.json()).catch(() => ({ down: true })).then(d => {
      if (d.role) { location.reload(); return; }
      if (d.down) return emergencyGate(true);
      if (d.reason === 'acesso') { document.body.insertAdjacentHTML('beforeend', '<div id="gate"><div style="color:#85858e;font-size:13px;text-align:center;line-height:1.6">Você não tem acesso à Lousa.<br>Peça a liberação no Quintal.</div></div>'); return; }
      toQuintal();
    });
  };
})();
</script>
